# EPP (Endpoint Picker): a gRPC ext_proc server the Gateway calls per-request. It watches vLLM's
# /metrics (queue depth, KV-cache utilization) via the Pods selected by the InferencePool and
# returns the single best Pod for each request -- this is what makes inference-aware load
# balancing different from a Service's round robin.
#
# Image: registry.k8s.io/gateway-api-inference-extension/epp:v1.6.1
# VERIFY: exact image path/tag -- the v1.6.1 release notes reference an "lwepp" (lightweight EPP)
# image alongside the standard EPP; upstream's own getting-started guide (helm chart
# oci://registry.k8s.io/gateway-api-inference-extension/charts/inferencepool) installs this
# Deployment for you. Confirm the tag with:
#   helm show values oci://registry.k8s.io/gateway-api-inference-extension/charts/inferencepool --version v1.6.1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-epp
  labels:
    app.kubernetes.io/name: vllm-epp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-epp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-epp
    spec:
      serviceAccountName: vllm-epp
      containers:
      - name: epp
        image: registry.k8s.io/gateway-api-inference-extension/epp:v1.6.1 # VERIFY
        args:
        - --pool-name=vllm-pool
        - --pool-namespace=$(POD_NAMESPACE)
        - --port=9002
        - --grpc-health-port=9003
        - --metrics-port=9090
        - -v=2
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: grpc-epp
          containerPort: 9002
        - name: grpc-health
          containerPort: 9003
        - name: metrics
          containerPort: 9090
        readinessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 5
        livenessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 5
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 512Mi
