# Cloud-agnostic base: namespace + InferencePool/EPP + Gateway/HTTPRoute + the vLLM pool (imported
# from chapter 09) + the multi-node LeaderWorkerSet variant. Do not apply directly: use
# ../gke, ../eks or ../aks, which patch in the cloud's GatewayClass and GPU/spot node selectors.
# Prerequisite (cluster-scoped, run once, NOT part of this kustomization): install-gateway-crds.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch12-gateway
labels:
- pairs:
    app.kubernetes.io/part-of: ch12-gateway
  includeSelectors: false
resources:
- gateway.yaml
- httproute.yaml
- inferencepool
- vllm-pool
- multinode-lws
