# Reuses chapter 09's vLLM base directory wholesale (Deployment/Service/PDB, Qwen3-0.6B, probes,
# spot-safe shutdown) instead of duplicating it. kustomize's namespace transformer renames the
# imported namespace.yaml's Namespace object (ch09-vllm) to ch12-gateway too, so that becomes the
# ONE Namespace object for this whole chapter (chapter 12 has no namespace.yaml of its own --
# defining ch12-gateway a second time would collide with this one). Add the
# chapter 09 HF-cache PVC component the same way chapter 09's own overlays do if you want
# persistent weights (see 05-model-storage-and-data for the full storage story).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch12-gateway
resources:
- ../../../09-llm-inference-with-vllm/common
