# CPU-only variant: no cloud account, no GPU quota. Reuses chapter 09's cpu-lab (Ollama +
# Qwen3-0.6B) as the backend, adds a real Gateway API Gateway/HTTPRoute (NGINX Gateway Fabric)
# in front of it, and a trivial LeaderWorkerSet to show the multi-node grouping mechanic.
# Prereqs (install once, cluster-scoped, works on kind/minikube too):
#   helm upgrade --install ngf oci://ghcr.io/nginx/charts/nginx-gateway-fabric --version 2.7.0 \
#     -n nginx-gateway --create-namespace
#   ../common/install-gateway-crds.sh   # Gateway API core CRDs only; InferencePool CRD unused here
#   ../common/install-lws.sh
#   kubectl apply -k 12-inference-gateway-and-multinode-serving/cpu-lab
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch09-vllm-cpu
resources:
- ../../09-llm-inference-with-vllm/cpu-lab
- gateway.yaml
- httproute.yaml
- lws-demo.yaml
