# CPU-only LWS mechanics demo: no Ray, no GPUs, no real tensor parallelism -- just enough to show
# how a LeaderWorkerSet forms a group, what LWS_LEADER_ADDRESS/LWS_GROUP_INDEX/LWS_WORKER_INDEX
# look like from inside a Pod, and how the leader's headless Service resolves. Swap the image/
# command for the real gke|eks|aks/../common/multinode-lws/leaderworkerset.yaml once you have 2+
# spot GPU nodes.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: lws-demo
  labels:
    app.kubernetes.io/name: lws-demo
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    leaderTemplate:
      metadata:
        labels: {app.kubernetes.io/name: lws-demo, role: leader}
      spec:
        containers:
        - name: leader
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
          - |
            echo "I am the leader. LWS_LEADER_ADDRESS=$LWS_LEADER_ADDRESS LWS_GROUP_INDEX=$LWS_GROUP_INDEX";
            while true; do sleep 3600; done
          resources: {requests: {cpu: 50m, memory: 32Mi}}
    workerTemplate:
      metadata:
        labels: {app.kubernetes.io/name: lws-demo, role: worker}
      spec:
        containers:
        - name: worker
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
          - |
            echo "I am worker $LWS_WORKER_INDEX. Leader is at $LWS_LEADER_ADDRESS";
            while true; do sleep 3600; done
          resources: {requests: {cpu: 50m, memory: 32Mi}}
