# GKE Inference Gateway is only supported on the gke-l7-regional-external-managed and gke-l7-rilb
# GatewayClasses (regional external / regional internal L7). Use the external one for the lab so
# you can curl it from your laptop.
- op: replace
  path: /spec/gatewayClassName
  value: gke-l7-regional-external-managed
