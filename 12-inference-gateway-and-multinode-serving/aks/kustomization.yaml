# AKS: Application Gateway for Containers' ALB Controller is the Azure-native Gateway API
# implementation (GatewayClass azure-alb-external), but its Inference Extension conformance is
# unconfirmed at pin time -- VERIFY before swapping it in. We install NGINX Gateway Fabric
# instead, same as eks/, for a verified-conformant path that works identically on both clouds.
#   ../../01-gpu-nodes-and-scheduling/aks/create-gpu-nodepool.sh MAX_NODES=2
#   ./install-nginx-gateway-fabric.sh
#   ../common/install-gateway-crds.sh && ../common/install-lws.sh
#   ../../09-llm-inference-with-vllm/common/create-hf-secret.sh ch12-gateway
#   kubectl apply -k 12-inference-gateway-and-multinode-serving/aks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../common
patches:
- target: {kind: Gateway, name: inference-gateway}
  path: patch-gatewayclass.yaml
- target: {kind: Deployment, name: vllm}
  path: patch-spot-vllm.yaml
- target: {kind: LeaderWorkerSet, name: vllm-multinode}
  path: patch-spot-lws.yaml
