- op: add
  path: /spec/leaderWorkerTemplate/leaderTemplate/spec/nodeSelector
  value:
    kubernetes.azure.com/scalesetpriority: spot
    nvidia.com/gpu.present: "true"
- op: add
  path: /spec/leaderWorkerTemplate/leaderTemplate/spec/tolerations/-
  value:
    key: kubernetes.azure.com/scalesetpriority
    operator: Equal
    value: spot
    effect: NoSchedule
- op: add
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/nodeSelector
  value:
    kubernetes.azure.com/scalesetpriority: spot
    nvidia.com/gpu.present: "true"
- op: add
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/tolerations/-
  value:
    key: kubernetes.azure.com/scalesetpriority
    operator: Equal
    value: spot
    effect: NoSchedule
