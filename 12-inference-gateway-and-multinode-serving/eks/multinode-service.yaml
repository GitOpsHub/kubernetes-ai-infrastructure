# LWS auto-creates a headless Service for leader<->worker discovery (named after the LWS). This
# is a regular ClusterIP Service in front of the leader Pod's OpenAI-compatible port, for clients
# (or the Gateway/InferencePool) that just want to call the multi-node replica.
apiVersion: v1
kind: Service
metadata:
  name: vllm-multinode
  namespace: ch12-gateway
  labels:
    app.kubernetes.io/name: vllm-multinode
spec:
  selector:
    app.kubernetes.io/name: vllm-multinode
    role: leader
  ports:
  - name: http
    port: 8000
    targetPort: http
