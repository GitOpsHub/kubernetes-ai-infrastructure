# vLLM OpenAI-compatible server for one small, ungated model on ONE GPU. Reuses chapter 09's
# vllm-deployment.yaml (same image/probes/shutdown handling) rather than re-teaching it -- see
# 09-llm-inference-with-vllm for the full walkthrough of this manifest -- with the EKS spot/GPU
# nodeSelector inlined below instead of a kustomize patch.
#
# Image: vllm/vllm-openai:v0.29.0-cu129
#   The plain v0.29.0 tag is built on CUDA 13.0 and needs an NVIDIA driver >= 580.
#   The -cu129 variant (CUDA 12.9) runs on older 5xx drivers via CUDA minor-version
#   compatibility, which is what cloud-managed GPU drivers often ship. If your nodes run
#   a 580+ driver you can switch to the plain tag.
# Entrypoint of the image is ["vllm", "serve"], so args start with the model id.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ch12-gateway
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  # Never run two copies of a 1-GPU pod during a rollout on a 1-GPU node pool:
  # Recreate frees the GPU first. (Use RollingUpdate with maxSurge when you have spare GPUs.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      # Spot notice: EC2 gives spot instances a 2-minute interruption warning.
      # Keep grace <= that budget. preStop (5s) + drain (--shutdown-timeout 10s).
      terminationGracePeriodSeconds: 25
      # nvidia.com/gpu.present=true is set at boot by nodeadm on the EKS AL2023 NVIDIA AMI
      # (01-gpu-nodes-and-scheduling's pool). eks.amazonaws.com/capacityType=SPOT pins this Pod
      # to the spot-gpu nodegroup created in chapter 01.
      nodeSelector:
        eks.amazonaws.com/capacityType: SPOT
        nvidia.com/gpu.present: "true"
      tolerations:
      # The spot-gpu node group taints its nodes nvidia.com/gpu=present:NoSchedule
      # (01-gpu-nodes-and-scheduling) so ordinary Pods don't accidentally land on GPU machines.
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.29.0-cu129
        args:
        - Qwen/Qwen3-0.6B
        - --host=0.0.0.0
        - --port=8000
        # Cap context: KV cache must fit at least one max-length sequence.
        - --max-model-len=8192
        # Fraction of GPU memory vLLM may take for weights + activations + KV cache.
        - --gpu-memory-utilization=0.90
        # Upper bound on sequences batched together in one decode step.
        - --max-num-seqs=64
        - --enable-prefix-caching
        # On SIGTERM wait up to 10s for in-flight requests instead of aborting them (0 = abort).
        - --shutdown-timeout=10
        env:
        - name: HF_HOME
          value: /root/.cache/huggingface
        - name: HF_TOKEN            # Qwen3-0.6B is ungated; token only avoids anonymous rate limits
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            memory: 12Gi
            nvidia.com/gpu: "1"
        # The HTTP server only starts answering once weights are loaded and the KV cache
        # is allocated. startupProbe gives it up to 60 x 10s = 10 min (image pull is NOT
        # counted: probes start after the container starts).
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 4
        lifecycle:
          preStop:
            # Give kube-proxy / gateways time to remove the endpoint before vLLM stops accepting.
            sleep:
              seconds: 5
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: dshm
          mountPath: /dev/shm
      volumes:
      # Download cache. emptyDir = re-download on every new node (spot!). See
      # 05-model-storage-and-data for PVC / object-storage / image-preload alternatives.
      - name: hf-cache
        emptyDir:
          sizeLimit: 20Gi
      # PyTorch/NCCL use shared memory between processes (tensor parallel workers, tokenizer
      # workers). Container runtimes default /dev/shm to 64Mi, which crashes multi-GPU runs.
      # medium: Memory counts against the container memory limit.
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
