# Multi-node serving: one logical vLLM replica spans 2 Pods on 2 different (1-GPU) nodes, joined
# by Ray and running tensor-parallel-size=2 ACROSS the node boundary -- this is what LeaderWorkerSet
# (LWS) exists for: chapter 09's Deployment can only ever use the GPUs on ONE node.
#
# apiVersion/kind verified: leaderworkerset.x-k8s.io/v1, LWS v0.10.0.
# leaderWorkerTemplate.size is the TOTAL group size (1 leader + N-1 workers); size: 2 = 1 leader
# + 1 worker = a 2-GPU TP group. LWS injects LWS_LEADER_ADDRESS (leader's stable DNS name),
# LWS_GROUP_INDEX and LWS_WORKER_INDEX into every Pod's env automatically.
# VERIFY: exact injected env var names/behavior against `kubectl explain leaderworkerset.spec` and
# https://lws.sigs.k8s.io/docs/concepts/leaderworkerset/ at v0.10.0 before relying on them in prod.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm-multinode
  namespace: ch12-gateway
  labels:
    app.kubernetes.io/name: vllm-multinode
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: vllm-multinode
          role: leader
      spec:
        terminationGracePeriodSeconds: 30
        # Needs 2 nodes in the spot-gpu group up at once -- see README Step 2
        # (eksctl scale nodegroup ... --nodes 2).
        nodeSelector:
          eks.amazonaws.com/capacityType: SPOT
          nvidia.com/gpu.present: "true"
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        containers:
        - name: vllm-leader
          image: vllm/vllm-openai:v0.29.0-cu129
          # Ray head, wait for the worker(s) to join, then serve with TP across the whole group.
          command: ["/bin/sh", "-c"]
          args:
          - |
            set -e
            ray start --head --port=6379 --dashboard-host=0.0.0.0 --disable-usage-stats
            until [ "$(ray status 2>/dev/null | grep -c node_)" -ge 2 ]; do
              echo "waiting for $LWS_GROUP_SIZE ray nodes to join..."; sleep 5
            done
            exec vllm serve Qwen/Qwen3-0.6B \
              --host=0.0.0.0 --port=8000 \
              --tensor-parallel-size=2 \
              --distributed-executor-backend=ray \
              --max-model-len=8192 \
              --shutdown-timeout=10
          env:
          - name: HF_HOME
            value: /root/.cache/huggingface
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
                optional: true
          - name: LWS_GROUP_SIZE
            value: "2"
          ports:
          - name: http
            containerPort: 8000
          - name: ray-gcs
            containerPort: 6379
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {memory: 12Gi, nvidia.com/gpu: "1"}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
          - {name: hf-cache, mountPath: /root/.cache/huggingface}
          - {name: dshm, mountPath: /dev/shm}
        volumes:
        - name: hf-cache
          emptyDir: {sizeLimit: 20Gi}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: vllm-multinode
          role: worker
      spec:
        terminationGracePeriodSeconds: 30
        nodeSelector:
          eks.amazonaws.com/capacityType: SPOT
          nvidia.com/gpu.present: "true"
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        containers:
        - name: vllm-worker
          image: vllm/vllm-openai:v0.29.0-cu129
          command: ["/bin/sh", "-c"]
          # LWS_LEADER_ADDRESS is the leader Pod's stable headless-Service DNS name, injected by LWS.
          args:
          - |
            set -e
            exec ray start --address="${LWS_LEADER_ADDRESS}:6379" --block
          env:
          - name: HF_HOME
            value: /root/.cache/huggingface
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {memory: 12Gi, nvidia.com/gpu: "1"}
          volumeMounts:
          - {name: hf-cache, mountPath: /root/.cache/huggingface}
          - {name: dshm, mountPath: /dev/shm}
        volumes:
        - name: hf-cache
          emptyDir: {sizeLimit: 20Gi}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
