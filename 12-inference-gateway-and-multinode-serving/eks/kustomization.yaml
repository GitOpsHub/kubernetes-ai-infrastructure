# EKS: no first-party Gateway-API-Inference-Extension-conformant AWS controller yet (the AWS
# Load Balancer Controller's Gateway API GA support and the VPC Lattice controller are ALB/mesh
# implementations without confirmed InferencePool conformance at pin time -- VERIFY before relying
# on either in place of this). We install NGINX Gateway Fabric instead: self-hosted, upstream-listed
# as Inference Extension conformant, works identically on every cloud behind a Service of type
# LoadBalancer.
#   eksctl scale nodegroup ... --name spot-gpu --nodes 2   # reuse chapter 01's spot-gpu group
#   ../common/install-gateway-crds.sh && ../common/install-lws.sh
#   kubectl create secret generic hf-token ...   (see README Step 3)
#   kubectl apply -k 12-inference-gateway-and-multinode-serving/eks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../common
patches:
- target: {kind: Gateway, name: inference-gateway}
  path: patch-gatewayclass.yaml
- target: {kind: Deployment, name: vllm}
  path: patch-spot-vllm.yaml
- target: {kind: LeaderWorkerSet, name: vllm-multinode}
  path: patch-spot-lws.yaml
