# Stands in for the GPU path's Kueue-admitted TrainJob (../common/pipeline/workflowtemplate-platform-e2e.yaml's
# `submit-trainjob` step) so the CPU lab still exercises the queueing layer, not just training+serving.
# Chapter 07's Kubeflow Trainer TrainJob is GPU-only end to end (its TrainingRuntime hard-codes
# `nvidia.com/gpu` requests) and 07's own cpu-lab/ directory ships no manifests to swap in (see this
# chapter's README "Brief vs reality" note) -- so rather than invent a CPU TrainJob/TrainingRuntime
# that chapter 07 doesn't own, this is a plain batch/v1 Job in the SAME shape as chapter 06's
# `job-simple.yaml`/`job-indexed-spot.yaml`, admitted through chapter 06's cpu-lab `team-a-queue`
# LocalQueue (06-batch-jobs-and-kueue/common/queues) unmodified. Run this before the Argo pipeline
# below to see admission happen (`kubectl get workload -n ch06-kueue`), then watch it complete before
# a second one queues behind it if you've already used up team-a-cq's quota.
apiVersion: batch/v1
kind: Job
metadata:
  name: ch16-cpu-preprocess
  namespace: ch06-kueue
  labels:
    kueue.x-k8s.io/queue-name: team-a-queue
    app.kubernetes.io/part-of: ch16-capstone-cpu
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ch16-cpu-preprocess
    spec:
      containers:
        - name: worker
          image: python:3.12-slim
          command: ["python", "-c"]
          args:
            - |
              import time
              print("pretending to tokenize/shard a dataset shard...")
              time.sleep(20)
              print("done")
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      restartPolicy: Never
