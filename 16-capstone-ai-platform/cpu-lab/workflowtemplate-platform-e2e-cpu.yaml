# The CPU counterpart of ../common/pipeline/workflowtemplate-platform-e2e.yaml: same shape --
# train, register, promote, smoke-test -- but every GPU-only step is swapped for its cpu-lab
# equivalent, and the training step is NOT reinvented here: it calls chapter 15's own
# `train-and-register` WorkflowTemplate (15-mlops-gitops-and-pipelines/common/workflows) via
# `templateRef`, the same CPU-friendly stand-in chapter 15 already ships for exactly this reason
# (its own comment: "swap the image/command for a real one... this inline Python step is the
# CPU-friendly stand-in"). This template only adds what chapter 15 doesn't: promoting the
# cpu-lab Ollama deployment (chapter 09) and a smoke test through it.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: platform-e2e-cpu
  namespace: ch15-pipelines
spec:
  entrypoint: platform-e2e-cpu
  serviceAccountName: capstone-pipeline-cpu
  templates:
  - name: platform-e2e-cpu
    steps:
    - - name: train-and-register
        templateRef:
          name: train-and-register   # 15-mlops-gitops-and-pipelines/common/workflows/workflowtemplate-train-pipeline.yaml
          template: pipeline
    - - name: promote-ollama
        template: promote-ollama
    - - name: smoke-test-ollama
        template: smoke-test-ollama

  - name: promote-ollama
    # Bumps the pod template annotation on chapter 09's cpu-lab Ollama Deployment so anything
    # watching it (e.g. a HPA/KEDA setup you added per chapter 10) sees a new rollout. Ollama's
    # Deployment uses `strategy.type: Recreate` (09-llm-inference-with-vllm/cpu-lab/ollama-deployment.yaml),
    # same as the GPU path's vLLM Deployment, so this is a full pod replacement, not a rolling update.
    resource:
      action: patch
      mergeStrategy: strategic
      manifest: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ollama
          namespace: ch09-vllm-cpu
        spec:
          template:
            metadata:
              annotations:
                ch16.kubernetes-ai-infrastructure/pipeline-run: "{{workflow.uid}}"

  - name: smoke-test-ollama
    # Confirms the promoted Ollama pod actually serves: `/api/tags` is Ollama's own lightweight
    # "server is up and the model is pulled" endpoint (cheaper than a full chat completion here).
    container:
      image: curlimages/curl:8.11.1
      command: ["sh", "-c"]
      args:
        - |
          set -e
          curl -sf -m20 http://ollama.ch09-vllm-cpu.svc.cluster.local:11434/api/tags
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 250m, memory: 128Mi}
