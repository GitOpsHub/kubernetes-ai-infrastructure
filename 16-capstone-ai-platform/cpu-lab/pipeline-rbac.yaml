# The CPU pipeline needs its own identity, same reasoning as ../common/pipeline/namespace-rbac.yaml
# for the GPU path: it runs as a ServiceAccount in ch15-pipelines but has to patch a Deployment in
# ch09-vllm-cpu (promote-ollama, below) -- genuinely cross-namespace. Rather than widen chapter 15's
# own `pipelines-runner` Role, this SA gets its own RoleBinding onto that EXISTING Role (reused by
# name, not duplicated) plus a new, narrowly-scoped Role in ch09-vllm-cpu. Same "no self-escalation"
# posture as chapter 14's tenant Roles and the GPU-path capstone-pipeline SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capstone-pipeline-cpu
  namespace: ch15-pipelines
---
# Reuses 15-mlops-gitops-and-pipelines/common/workflows/serviceaccount-pipelines-runner.yaml's
# Role (same rules chapter 15's own `pipelines-runner` SA already has: create/watch pods, pods/log,
# PVCs, and manage Workflows/WorkflowTemplates) -- this chapter's WorkflowTemplate calls chapter 15's
# `train-and-register` via templateRef, so its steps need the same permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capstone-pipeline-cpu-uses-pipelines-runner
  namespace: ch15-pipelines
subjects:
- kind: ServiceAccount
  name: capstone-pipeline-cpu
  namespace: ch15-pipelines
roleRef:
  kind: Role
  name: pipelines-runner   # defined by 15-mlops-gitops-and-pipelines/common/workflows -- not redefined here
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capstone-ollama-promoter
  namespace: ch09-vllm-cpu
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capstone-ollama-promoter
  namespace: ch09-vllm-cpu
subjects:
- kind: ServiceAccount
  name: capstone-pipeline-cpu
  namespace: ch15-pipelines
roleRef:
  kind: Role
  name: capstone-ollama-promoter
  apiGroup: rbac.authorization.k8s.io
