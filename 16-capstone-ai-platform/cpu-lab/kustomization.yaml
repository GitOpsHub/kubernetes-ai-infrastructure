# No-GPU capstone bring-up. Unlike gke/eks/aks (which layer ../common on top of a specific cloud),
# this overlay does NOT include ../common -- ../common/pipeline targets a real TrainJob/vLLM that
# don't exist without GPU quota. These three manifests stand alone; see the README's "CPU lab"
# section for the full command sequence and what doesn't carry over.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pipeline-rbac.yaml
  - queued-cpu-job.yaml
  - workflowtemplate-platform-e2e-cpu.yaml
