# Bridges a naming gap this capstone found between chapters 06 and 07 while assembling the
# platform end to end: 07-distributed-training-kubeflow-trainer/eks/localqueue.yaml
# (`ch07-queue`) points spec.clusterQueue at "team-research" — a ClusterQueue that
# 06-batch-jobs-and-kueue never defines (it ships `team-a-cq`/`team-b-cq` instead), and neither
# of those two cover `nvidia.com/gpu` in `coveredResources` (chapter 06 is CPU-only batch by
# design). Applied as-is, chapter 07's GPU TrainJob would sit `Pending` forever waiting on a
# ClusterQueue that doesn't exist. Rather than edit chapter 06 or 07's files (out of this
# chapter's scope — see this repo's per-chapter ownership convention), the capstone adds the
# missing ClusterQueue here: same cohort as chapter 06 (shares/borrows its CPU quota) plus the
# GPU coverage chapter 07 actually needs, reusing chapter 06's existing `spot`/`on-demand`
# ResourceFlavors (cluster-scoped, referenced by name — not redefined).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: team-research
  labels:
    app.kubernetes.io/part-of: ch16-capstone
spec:
  cohortName: ch06-cohort   # joins 06-batch-jobs-and-kueue/eks/cohort.yaml's cohort
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: spot
          resources:
            - name: "cpu"
              nominalQuota: 8
              borrowingLimit: 8
            - name: "memory"
              nominalQuota: 32Gi
              borrowingLimit: 32Gi
            - name: "nvidia.com/gpu"
              nominalQuota: 2
              borrowingLimit: 2
        - name: on-demand
          resources:
            - name: "cpu"
              nominalQuota: 2
            - name: "memory"
              nominalQuota: 8Gi
            - name: "nvidia.com/gpu"
              nominalQuota: 1
  preemption:
    reclaimWithinCohort: LowerPriority
    borrowWithinCohort:
      policy: LowerPriority
      maxPriorityThreshold: 10000
    withinClusterQueue: LowerOrNewerEqualPriority
