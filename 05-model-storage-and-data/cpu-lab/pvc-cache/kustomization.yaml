# Pattern (b) on a single-node / RWO world: cluster default StorageClass (kind: local-path,
# GKE: standard-rwo, EKS: gp3 via EBS CSI if default, AKS: managed-csi), ReadWriteOnce, 1 replica.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch05-models
resources:
  - ../../common/shared-fs
patches:
  - target: {kind: PersistentVolumeClaim, name: model-cache}
    patch: |-
      - op: remove
        path: /spec/storageClassName
      - op: replace
        path: /spec/accessModes
        value: ["ReadWriteOnce"]
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target: {kind: Deployment, name: qwen-from-pvc}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
