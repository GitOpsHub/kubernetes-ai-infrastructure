# Pattern (b)+(d): a PVC used as a model cache, populated once by a Job, mounted by every replica.
# ReadWriteMany (Filestore / EFS / Azure Files) lets many pods on many nodes/zones share it.
# The cloud overlay sets storageClassName (and size minimums).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch05-models
resources:
  - ../base
  - pvc.yaml
  - populate-job.yaml
  - serve-deployment.yaml
  - service.yaml
