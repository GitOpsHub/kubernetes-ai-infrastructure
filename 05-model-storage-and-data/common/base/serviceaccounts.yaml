# Two identities on purpose: the loader Job can write, the serving pods can only read.
# Each cloud overlay binds these to cloud IAM (Workload Identity Federation for GKE,
# EKS Pod Identity, Azure Workload Identity). See <cloud>/setup-*-iam.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-writer
  namespace: ch05-models
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-reader
  namespace: ch05-models
