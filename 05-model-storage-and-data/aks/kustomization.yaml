# AKS: model container in Azure Blob Storage mounted with the Azure Blob CSI driver (blobfuse2),
# authenticated with Azure Workload Identity (user-assigned managed identity + federated credentials).
#   ./create-nodepool.sh && ./setup-blob-iam.sh   (writes bucket.env)
#   kubectl apply -k 05-model-storage-and-data/aks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch05-models
resources:
  - ../common/object-storage
  - pv-pvc-blob.yaml
configMapGenerator:
  - name: storage-params
    envs: [bucket.env]
    options:
      disableNameSuffixHash: true
replacements:
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.AZ_STORAGE_RG}
    targets:
      - select: {kind: PersistentVolume, name: model-bucket-blob}
        fieldPaths: [spec.csi.volumeAttributes.resourceGroup]
      - select: {kind: PersistentVolume, name: model-bucket-blob}
        fieldPaths: [spec.csi.volumeHandle]
        options: {delimiter: "#", index: 0}
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.AZ_STORAGE_ACCOUNT}
    targets:
      - select: {kind: PersistentVolume, name: model-bucket-blob}
        fieldPaths: [spec.csi.volumeAttributes.storageAccount]
      - select: {kind: PersistentVolume, name: model-bucket-blob}
        fieldPaths: [spec.csi.volumeHandle]
        options: {delimiter: "#", index: 1}
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.AZ_CONTAINER}
    targets:
      - select: {kind: PersistentVolume, name: model-bucket-blob}
        fieldPaths: [spec.csi.volumeAttributes.containerName]
      - select: {kind: PersistentVolume, name: model-bucket-blob}
        fieldPaths: [spec.csi.volumeHandle]
        options: {delimiter: "#", index: 2}
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.AZ_MI_CLIENT_ID}
    targets:
      - select: {kind: PersistentVolume, name: model-bucket-blob}
        fieldPaths: [spec.csi.volumeAttributes.clientID]
patches:
  - target: {kind: Job, name: upload-model}
    path: patch-spot.yaml
  - target: {kind: Deployment, name: qwen-from-bucket}
    path: patch-spot.yaml
