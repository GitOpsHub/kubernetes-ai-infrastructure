# AKS shared file system: Azure Files via the built-in azurefile-csi-premium StorageClass (SMB, RWX).
# Premium file shares bill on provisioned size (100 GiB minimum).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch05-models
resources:
  - ../../common/shared-fs
patches:
  - target: {kind: PersistentVolumeClaim, name: model-cache}
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: azurefile-csi-premium
  - target: {kind: Deployment, name: qwen-from-pvc}
    path: patch-spot.yaml
  - target: {kind: Job, name: populate-model-cache}
    path: patch-spot.yaml
