# EKS shared file system: Amazon EFS CSI driver, dynamic provisioning via EFS access points.
#   ./setup-efs.sh   (creates FS + mount targets + add-on, writes efs.env)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch05-models
resources:
  - ../../common/shared-fs
  - storageclass-efs.yaml
configMapGenerator:
  - name: efs-params
    envs: [efs.env]
    options:
      disableNameSuffixHash: true
replacements:
  - source: {kind: ConfigMap, name: efs-params, fieldPath: data.EFS_FILE_SYSTEM_ID}
    targets:
      - select: {kind: StorageClass, name: efs-models}
        fieldPaths: [parameters.fileSystemId]
patches:
  - target: {kind: PersistentVolumeClaim, name: model-cache}
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: efs-models
  - target: {kind: Deployment, name: qwen-from-pvc}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {eks.amazonaws.com/capacityType: SPOT}
  - target: {kind: Job, name: populate-model-cache}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {eks.amazonaws.com/capacityType: SPOT}
