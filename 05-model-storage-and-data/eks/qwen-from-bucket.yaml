# Serve the model straight from the bucket mount. CPU vLLM image so the lab runs without GPU quota;
# chapter 09-llm-inference-with-vllm swaps in vllm/vllm-openai + nvidia.com/gpu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-from-bucket
  namespace: ch05-models
  labels:
    app: qwen-from-bucket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-from-bucket
  template:
    metadata:
      labels:
        app: qwen-from-bucket
    spec:
      serviceAccountName: model-reader
      terminationGracePeriodSeconds: 30
      # Managed node group spot label. With Karpenter use karpenter.sh/capacity-type: spot instead.
      nodeSelector:
        eks.amazonaws.com/capacityType: SPOT
      initContainers:
        # Refuse to start on a half-uploaded model.
        - name: wait-for-model
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -f "/models/${MODEL_SUBDIR}/_COMPLETE" ]; do
                echo "waiting for /models/${MODEL_SUBDIR}/_COMPLETE"; sleep 10
              done
          envFrom:
            - configMapRef:
                name: model-coordinates
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          volumeMounts:
            - name: model-bucket
              mountPath: /models
              readOnly: true
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.29.0
          command: ["/bin/sh", "-c"]
          args:
            - exec vllm serve "/models/${MODEL_SUBDIR}" --served-model-name "${MODEL_NAME}" --host 0.0.0.0 --port 8000 --max-model-len 4096 --dtype bfloat16
          envFrom:
            - configMapRef:
                name: model-coordinates
          env:
            - name: VLLM_CPU_KVCACHE_SPACE   # GiB of RAM reserved for KV cache on CPU backend
              value: "2"
            - name: HF_HUB_OFFLINE           # never reach out to the Hub – weights come from the mount
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 10Gi
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 60        # up to 10 min: pull + mount + load
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          volumeMounts:
            - name: model-bucket
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-bucket
          persistentVolumeClaim:
            claimName: model-bucket
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-from-bucket
  namespace: ch05-models
spec:
  selector:
    app: qwen-from-bucket
  ports:
    - name: http
      port: 8000
      targetPort: http
