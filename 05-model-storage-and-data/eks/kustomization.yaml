# EKS: model bucket mounted with the Mountpoint for Amazon S3 CSI driver (v2),
# pod-level credentials via EKS Pod Identity (authenticationSource: pod).
#   eksctl create nodegroup -f nodegroup-ch05.yaml && ./setup-s3-iam.sh   (writes bucket.env)
#   kubectl apply -k 05-model-storage-and-data/eks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch05-models
resources:
  - ../common/object-storage
  - pv-pvc-mountpoint.yaml
configMapGenerator:
  - name: storage-params
    envs: [bucket.env]
    options:
      disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: storage-params
      fieldPath: data.S3_BUCKET
    targets:
      - select: {kind: PersistentVolume, name: model-bucket-s3}
        fieldPaths: [spec.csi.volumeAttributes.bucketName]
patches:
  - target: {kind: Job, name: upload-model}
    path: patch-spot.yaml
  - target: {kind: Deployment, name: qwen-from-bucket}
    path: patch-spot.yaml
