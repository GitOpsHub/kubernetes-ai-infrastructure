# Pattern (a): every pod downloads the model itself in an init container into an emptyDir.
# Simplest possible thing; cold start = full download on every pod start (including after every spot reclaim).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-init-download
  namespace: ch05-models
  labels:
    app: qwen-init-download
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-init-download
  template:
    metadata:
      labels:
        app: qwen-init-download
    spec:
      nodeSelector:
        eks.amazonaws.com/capacityType: SPOT
      initContainers:
        - name: fetch-model
          image: ghcr.io/astral-sh/uv:0.12.15-python3.12-trixie-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              uvx --from huggingface_hub==1.31.0 hf download "${MODEL_ID}" \
                --revision "${MODEL_REVISION}" --local-dir /models/model \
                --exclude "*.md" --exclude ".gitattributes"
              du -sh /models/model
          envFrom:
            - configMapRef: {name: model-coordinates}
          env:
            - {name: UV_CACHE_DIR, value: /models/.uv-cache}
            - {name: HF_HOME, value: /models/.hf-home}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: HF_TOKEN, optional: true}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: models, mountPath: /models}
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.29.0
          command: ["/bin/sh", "-c"]
          args:
            - exec vllm serve /models/model --served-model-name "${MODEL_NAME}" --host 0.0.0.0 --port 8000 --max-model-len 4096 --dtype bfloat16
          envFrom:
            - configMapRef: {name: model-coordinates}
          env:
            - {name: VLLM_CPU_KVCACHE_SPACE, value: "2"}
            - {name: HF_HUB_OFFLINE, value: "1"}
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: "4", memory: 8Gi, ephemeral-storage: 4Gi}
            limits: {memory: 10Gi, ephemeral-storage: 6Gi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 4Gi   # counts against node ephemeral storage – size node boot disks accordingly
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-init-download
  namespace: ch05-models
spec:
  selector:
    app: qwen-init-download
  ports:
    - {name: http, port: 8000, targetPort: http}
