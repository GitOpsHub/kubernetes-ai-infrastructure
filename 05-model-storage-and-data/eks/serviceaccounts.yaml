# Two identities on purpose: the loader Job can write, the serving pods can only read.
# Both are bound to EKS IAM roles via a Pod Identity association created in the README's Step 2
# (writer: ListBucket/GetObject/PutObject/AbortMultipartUpload; reader: ListBucket/GetObject only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-writer
  namespace: ch05-models
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-reader
  namespace: ch05-models
