# GKE: model bucket mounted with the Cloud Storage FUSE CSI driver, identity via
# Workload Identity Federation for GKE (IAM granted directly to the KSA principal – no GSA, no annotation).
#   ./create-nodepool.sh && ./setup-gcs-iam.sh   (writes bucket.env)
#   kubectl apply -k 05-model-storage-and-data/gke
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch05-models
resources:
  - ../common/object-storage
  - pv-pvc-gcsfuse.yaml
configMapGenerator:
  - name: storage-params
    envs: [bucket.env]
    options:
      disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: storage-params
      fieldPath: data.GCS_BUCKET
    targets:
      - select: {kind: PersistentVolume, name: model-bucket-gcs}
        fieldPaths: [spec.csi.volumeHandle]
patches:
  # The CSI driver's webhook injects the gke-gcsfuse-sidecar only into pods with this annotation.
  - target: {kind: Job, name: upload-model}
    path: patch-gcsfuse-pod.yaml
  - target: {kind: Deployment, name: qwen-from-bucket}
    path: patch-gcsfuse-pod.yaml
