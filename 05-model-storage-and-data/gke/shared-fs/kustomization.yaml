# GKE shared file system: Filestore CSI driver (RWX, NFS). Enable with ./enable-filestore.sh.
# standard-rwx = Basic HDD tier, 1 TiB minimum – mind the cost (see README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch05-models
resources:
  - ../../common/shared-fs
patches:
  - target: {kind: PersistentVolumeClaim, name: model-cache}
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: standard-rwx
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Ti
  - target: {kind: Deployment, name: qwen-from-pvc}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {cloud.google.com/gke-spot: "true"}
  - target: {kind: Job, name: populate-model-cache}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {cloud.google.com/gke-spot: "true"}
