# Bind to a Group so it maps straight onto real IdP groups behind each cloud's OIDC/IAM
# integration (GKE: Google Groups for RBAC via Workload Identity Federation for GKE / IAM;
# EKS: `aws eks create-access-entry --type STANDARD` mapped to an IAM group, or OIDC groups
# claim; AKS: Entra ID group via `az aks update --enable-azure-rbac` / kubeconfig OIDC).
# This repo doesn't stand up an IdP, so `kubectl` impersonation is how the lab verifies it
# (see README Step 3): `kubectl auth can-i --as-group=team-b-engineers ...`.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-edit-binding
  namespace: ch14-team-b
subjects:
- kind: Group
  name: team-b-engineers
  apiGroup: rbac.authorization.k8s.io
- kind: ServiceAccount
  name: team-b-ci
  namespace: ch14-team-b
roleRef:
  kind: Role
  name: tenant-edit
  apiGroup: rbac.authorization.k8s.io
