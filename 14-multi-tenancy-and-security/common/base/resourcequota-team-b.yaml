apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-b-quota
  namespace: ch14-team-b
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 16Gi
    requests.nvidia.com/gpu: "1"
    limits.cpu: "8"
    limits.memory: 32Gi
    limits.nvidia.com/gpu: "1"
    pods: "20"
    persistentvolumeclaims: "6"
    services.loadbalancers: "0"
    count/jobs.batch: "10"
