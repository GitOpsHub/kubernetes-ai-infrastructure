apiVersion: v1
kind: LimitRange
metadata:
  name: team-b-limits
  namespace: ch14-team-b
spec:
  limits:
  - type: Container
    default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
    max:
      cpu: "4"
      memory: 16Gi
      nvidia.com/gpu: "1"
    min:
      cpu: 50m
      memory: 64Mi
