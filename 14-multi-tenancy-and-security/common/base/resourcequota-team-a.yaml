# Hard ceiling per tenant namespace, independent of (and in addition to) Kueue's ClusterQueue
# quota from chapter 06. Kueue governs *admission* of batch Workloads across the whole cluster;
# ResourceQuota is the namespace-scoped backstop that also catches objects Kueue never sees
# (plain unmanaged Pods, Services, PVCs) and caps object counts, not just compute.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: ch14-team-a
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 32Gi
    requests.nvidia.com/gpu: "2"
    limits.cpu: "16"
    limits.memory: 64Gi
    limits.nvidia.com/gpu: "2"
    pods: "40"
    persistentvolumeclaims: "10"
    services.loadbalancers: "0"
    count/jobs.batch: "20"
