# Supply-chain guardrail #2: cryptographic signature verification. VAP/CEL (see vap-*.yaml)
# cannot call out to Rekor's transparency log or a registry's signature manifest, so this is
# Kyverno's job (installed by ../<gke|eks|aks|cpu-lab>/install-kyverno.sh).
#
# Two rules:
#  1. Your own pipeline's images (registry prefix from your CI, chapter 15's Argo Workflows
#     build step) MUST carry a valid keyless cosign signature from your GitHub Actions OIDC
#     identity. `background: false` + `failureAction: Enforce` means unsigned/forged images are
#     rejected at admission, not just flagged.
#  2. Everything else (upstream vllm/kserve/ray/nvidia images already allow-listed by
#     vap-restrict-registries.yaml) is left alone — most upstream OSS images used in this
#     course are NOT cosign-signed, so enforcing signatures on them would break every chapter.
#     Tighten this once you vendor/re-sign the images you actually run in production.
#
# VERIFY: the `subjectRegExp`/`issuerRegExp` values below are illustrative placeholders for
# "any workflow in the github.com/<org>/<repo> repo, on the main branch, via GitHub Actions
# OIDC" — replace <org>/<repo> with your real repository before relying on this, and confirm
# against `cosign verify --certificate-identity-regexp ... --certificate-oidc-issuer ...` for
# the image you actually signed. Kyverno also ships a newer CEL-native `ImageValidatingPolicy`
# CRD (kyverno.io/v2alpha1) as of the 1.14+ line; this course uses the longer-established
# ClusterPolicy verifyImages rule for stability — see
# https://kyverno.io/docs/policy-types/image-validating-policy/ if you want the newer form.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ch14-verify-signed-training-images
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  background: false
  validationFailureAction: Enforce
  rules:
  - name: verify-org-images
    match:
      any:
      - resources:
          kinds: ["Pod"]
          namespaceSelector:
            matchExpressions:
            - key: tenant
              operator: Exists
    verifyImages:
    - imageReferences:
        # VERIFY: point this at your org's actual image prefix once you build/push one.
        - "ghcr.io/YOUR_ORG/*"
      failureAction: Enforce
      attestors:
      - entries:
        - keyless:
            subjectRegExp: "https://github.com/YOUR_ORG/YOUR_REPO/.github/workflows/.+@refs/heads/main"
            issuerRegExp: "https://token.actions.githubusercontent.com"
            rekor:
              url: https://rekor.sigstore.dev
