apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secretmanager
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID_PLACEHOLDER   # patched by kustomize replacement, or edit directly
      auth:
        workloadIdentity:
          clusterLocation: ZONE_OR_REGION_PLACEHOLDER
          clusterName: GKE_CLUSTER_PLACEHOLDER
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
