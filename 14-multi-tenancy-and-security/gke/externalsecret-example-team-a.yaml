# Example: team-a's HF token lives in Secret Manager as `ch14-team-a-hf-token`, not in git.
# ESO polls the store every refreshInterval and reconciles a real Kubernetes Secret named
# hf-token in ch14-team-a — the same Secret name chapter 09/07's manifests already expect.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace: ch14-team-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secretmanager
    kind: ClusterSecretStore
  target:
    name: hf-token
    creationPolicy: Owner
  data:
  - secretKey: HF_TOKEN
    remoteRef:
      key: ch14-team-a-hf-token
