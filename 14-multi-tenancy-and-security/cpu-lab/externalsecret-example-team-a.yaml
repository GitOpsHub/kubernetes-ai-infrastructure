apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace: ch14-team-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: hf-token
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: fake-backend
