apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake-kubernetes-backend
spec:
  provider:
    kubernetes:
      remoteNamespace: external-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
