# Stand-in for "the cloud secret manager" on a cluster with no cloud IAM: a Secret in the
# external-secrets namespace that the `kubernetes` provider SecretStore reads from, so the
# ExternalSecret -> Secret sync loop is observable without GCP/AWS/Azure credentials.
# Never do this in a real environment — it's the lab-only substitute for Secret
# Manager/Secrets Manager/Key Vault, not a pattern to keep.
apiVersion: v1
kind: Secret
metadata:
  name: fake-backend
  namespace: external-secrets
stringData:
  HF_TOKEN: "hf_replace_me_in_your_own_lab"
