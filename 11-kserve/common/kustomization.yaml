# Cloud-agnostic base: namespace only. KServe itself is cluster-scoped (installed by
# <cloud>/install-kserve.sh, not by kustomize). predictive/ and generative/ are separate
# kustomizations layered by ../gke|eks|aks.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
