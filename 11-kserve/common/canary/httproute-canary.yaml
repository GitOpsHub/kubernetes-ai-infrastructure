# # VERIFY: exact generated Service name/suffix for a RawDeployment predictor has changed across
# KServe releases (commonly `<isvc-name>-predictor`) — confirm with
# `kubectl get svc -n ch11-kserve -l serving.kserve.io/inferenceservice` before relying on the
# backendRefs below, and adjust the names if your installed version differs.
# Requires Gateway API CRDs + an implementation installed (see 12-inference-gateway-and-multinode-serving).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sklearn-iris-canary
spec:
  parentRefs:
  - name: ch11-gateway          # create/point at your Gateway API Gateway; see chapter 12
  rules:
  - backendRefs:
    - name: sklearn-iris-stable-predictor
      port: 80
      weight: 90
    - name: sklearn-iris-canary-predictor
      port: 80
      weight: 10
