# CPU predictive model: KServe's own public sklearn Iris example (no cloud IAM needed — public
# GCS object, readable from any cluster/cloud). RawDeployment mode: plain Kubernetes
# Deployment/Service under the hood, no Knative/Istio dependency (see README "Deployment modes").
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: sklearn-iris
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    model:
      modelFormat:
        name: sklearn
      protocolVersion: v2          # KServe's V2 (Open Inference Protocol) REST/gRPC contract
      storageUri: "gs://kfserving-examples/models/sklearn/1.0/model"
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
