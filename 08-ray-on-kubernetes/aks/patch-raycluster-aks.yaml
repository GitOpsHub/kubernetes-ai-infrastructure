# AKS taints spot nodes automatically -- pods need BOTH the selector and the toleration, plus
# the GPU taint/toleration create-gpu-nodepool.sh adds itself.
- op: add
  path: /spec/workerGroupSpecs/0/template/spec/nodeSelector
  value:
    kubernetes.azure.com/scalesetpriority: spot
    nvidia.com/gpu.present: "true"
- op: add
  path: /spec/workerGroupSpecs/0/template/spec/tolerations
  value:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule
