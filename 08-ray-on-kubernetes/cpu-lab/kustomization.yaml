# CPU-only variant: no GPU quota, no cloud node-pool scripts, no spot placement needed.
# kubectl apply -k 08-ray-on-kubernetes/cpu-lab -- works on any cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
patches:
  - path: patch-raycluster-cpu.yaml
    target:
      group: ray.io
      kind: RayCluster
      name: ray-spot
