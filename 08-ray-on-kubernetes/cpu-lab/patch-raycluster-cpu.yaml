# Runs the "gpu-spot" worker group on CPU-only capacity, no cloud/spot placement at all -- works
# on any cluster (kind, a plain on-demand node pool, whatever 00-prerequisites-and-cluster-setup
# gave you). What doesn't carry over: GPU-bound Ray tasks/actors (`num_gpus=...`), NCCL-based
# multi-GPU work, and the "workers on spot" cost story this chapter's GPU labs are about --
# this variant only exercises the RayCluster/autoscaler/Serve mechanics.
- op: replace
  path: /spec/workerGroupSpecs/0/template/spec/containers/0/image
  value: rayproject/ray:2.52.0-py311
- op: remove
  path: /spec/workerGroupSpecs/0/template/spec/containers/0/resources/requests/nvidia.com~1gpu
- op: remove
  path: /spec/workerGroupSpecs/0/template/spec/containers/0/resources/limits/nvidia.com~1gpu
- op: replace
  path: /spec/workerGroupSpecs/0/template/spec/containers/0/resources/requests/cpu
  value: "1"
- op: replace
  path: /spec/workerGroupSpecs/0/template/spec/containers/0/resources/requests/memory
  value: 2Gi
- op: replace
  path: /spec/workerGroupSpecs/0/template/spec/containers/0/resources/limits/cpu
  value: "2"
- op: replace
  path: /spec/workerGroupSpecs/0/template/spec/containers/0/resources/limits/memory
  value: 4Gi
