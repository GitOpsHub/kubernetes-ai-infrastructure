# RayService: KubeRay owns a RayCluster for the lifetime of the Serve app and does zero-downtime
# upgrades (spin up a new cluster, wait for it to become healthy, switch traffic, tear down the
# old one) whenever spec.rayClusterConfig or serveConfigV2 changes -- unlike RayJob, RayService
# has no clusterSelector escape hatch to reuse an existing RayCluster; it always owns its own.
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: qwen-serve
  namespace: ch08-ray
  labels:
    app.kubernetes.io/part-of: ch08
spec:
  serveConfigV2: |
    applications:
      - name: qwen-generator
        import_path: serve_app:app
        route_prefix: /generate
        runtime_env:
          working_dir: "/home/ray/samples"
          pip:
            - transformers==4.57.1
            - accelerate==1.11.0
  rayClusterConfig:
    rayVersion: "2.52.0"
    headGroupSpec:
      serviceType: ClusterIP
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
      template:
        spec:
          serviceAccountName: ray
          containers:
            - name: ray-head
              image: rayproject/ray:2.52.0-py311
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 8000
                  name: serve
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {cpu: "1", memory: 2Gi}
              volumeMounts:
                - name: serve-app
                  mountPath: /home/ray/samples
          volumes:
            - name: serve-app
              configMap:
                name: qwen-serve-app
    workerGroupSpecs:
      - groupName: cpu-serve
        replicas: 1
        minReplicas: 1
        maxReplicas: 2
        rayStartParams: {}
        template:
          spec:
            serviceAccountName: ray
            containers:
              - name: ray-worker
                image: rayproject/ray:2.52.0-py311
                resources:
                  requests: {cpu: "2", memory: 4Gi}
                  limits: {cpu: "3", memory: 6Gi}
                volumeMounts:
                  - name: serve-app
                    mountPath: /home/ray/samples
            volumes:
              - name: serve-app
                configMap:
                  name: qwen-serve-app
