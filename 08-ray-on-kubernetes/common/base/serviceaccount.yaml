# Identity for Ray head/worker pods. This chapter doesn't need bucket access (no checkpointing
# lab here -- see 07-distributed-training-kubeflow-trainer and 05-model-storage-and-data for the
# per-cloud Workload Identity / IRSA / Azure Workload Identity bindings), so it ships with no
# cloud annotations. Bind it the same way those chapters do if you extend the RayJob/RayService
# labs to read models or write checkpoints to a bucket.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray
