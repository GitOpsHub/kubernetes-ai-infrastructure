# Kustomize Component: submit the RayJob (and the standalone RayCluster) through Kueue.
# 06-batch-jobs-and-kueue's kueue Helm values already enable the ray.io/rayjob, ray.io/rayservice
# and ray.io/raycluster integrations -- adding the queue-name label is all a workload needs here.
# Kueue's RayJob webhook manages spec.suspend itself (true until admitted, then false); the
# always-on RayCluster is admitted once at creation and simply held Pending until quota is free.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - localqueue.yaml
patches:
  - target:
      group: ray.io
      kind: RayJob
    patch: |-
      - op: add
        path: /metadata/labels/kueue.x-k8s.io~1queue-name
        value: ch08-queue
  - target:
      group: ray.io
      kind: RayCluster
    patch: |-
      - op: add
        path: /metadata/labels/kueue.x-k8s.io~1queue-name
        value: ch08-queue
