# Ephemeral-cluster RayJob: KubeRay creates a fresh RayCluster just for this job (from
# spec.rayClusterSpec below), runs the entrypoint, then tears the cluster down.
# This is the shape Kueue's RayJob integration is built around (see common/kueue/): Kueue admits
# or holds the *whole* embedded cluster spec as one Workload, unlike the always-on `ray-spot`
# RayCluster in raycluster-spot.yaml, which you'd instead put behind a RayCluster ClusterQueue
# integration (also enabled in 06-batch-jobs-and-kueue's values-kueue.yaml) if you wanted Kueue
# to gate it too.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: pi-estimate
  labels:
    app.kubernetes.io/part-of: ch08
spec:
  entrypoint: python /home/ray/samples/pi_estimate.py
  shutdownAfterJobFinishes: true    # tear down the ephemeral RayCluster once the job completes
  ttlSecondsAfterFinished: 60
  # suspend: kueue.x-k8s.io's webhook flips this true->false on admission (see common/kueue/) --
  # left unset here so `kubectl apply -k common` alone runs immediately, no queue required.
  rayClusterSpec:
    rayVersion: "2.52.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
      template:
        spec:
          serviceAccountName: ray
          containers:
            - name: ray-head
              image: rayproject/ray:2.52.0-py311
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {cpu: "1", memory: 2Gi}
              volumeMounts:
                - name: pi-estimate-script
                  mountPath: /home/ray/samples
          volumes:
            - name: pi-estimate-script
              configMap:
                name: pi-estimate-script
    workerGroupSpecs:
      - groupName: cpu-workers
        replicas: 2
        minReplicas: 2
        maxReplicas: 2
        rayStartParams: {}
        template:
          spec:
            serviceAccountName: ray
            containers:
              - name: ray-worker
                image: rayproject/ray:2.52.0-py311
                resources:
                  requests: {cpu: "2", memory: 4Gi}
                  limits: {cpu: "2", memory: 4Gi}
