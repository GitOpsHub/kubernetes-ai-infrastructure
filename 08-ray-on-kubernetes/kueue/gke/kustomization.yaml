# GKE + Kueue:  kubectl apply -k 08-ray-on-kubernetes/kueue/gke
# Lives at the chapter root (kueue/<cloud>, not <cloud>/kueue) for the same reason as
# 07-distributed-training-kubeflow-trainer/kueue/<cloud>: Kustomize refuses an overlay that
# resources its own parent directory ("cycle detected").
# Removes the hard spot nodeSelector from the RayCluster's GPU worker group so Kueue's
# ResourceFlavor (spot or on-demand fallback) decides the capacity type; keeps the GPU-type
# selector and tolerations. Also labels the RayJob/RayCluster for admission (common/kueue).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../gke
components:
  - ../../common/kueue
patches:
  - target:
      group: ray.io
      kind: RayCluster
      name: ray-spot
    patch: |-
      - op: remove
        path: /spec/workerGroupSpecs/0/template/spec/nodeSelector/cloud.google.com~1gke-spot
