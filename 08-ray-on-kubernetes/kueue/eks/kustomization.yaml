# EKS + Kueue:  kubectl apply -k 08-ray-on-kubernetes/kueue/eks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../eks
components:
  - ../../common/kueue
patches:
  - target:
      group: ray.io
      kind: RayCluster
      name: ray-spot
    patch: |-
      - op: remove
        path: /spec/workerGroupSpecs/0/template/spec/nodeSelector/eks.amazonaws.com~1capacityType
