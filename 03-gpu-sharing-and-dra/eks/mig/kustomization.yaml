apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../common/mig
patches:
  - target:
      kind: Deployment
      name: mig-demo
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          eks.amazonaws.com/capacityType: SPOT
          nvidia.com/mig.strategy: single
