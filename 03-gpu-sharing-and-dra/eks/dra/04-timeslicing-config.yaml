# Two containers in one Pod share one GPU with an explicit CUDA time-slice setting.
# Opaque driver config (GpuConfig) is passed through the claim to the driver.
# REQUIRES the alpha driver feature gate: --set featureGates.TimeSlicingSettings=true
# Without it the Pod sticks in ContainerCreating with FailedPrepareDynamicResources.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: timesliced-gpu
  namespace: ch03-gpu-sharing
spec:
  spec:
    devices:
      requests:
        - name: ts-gpu
          exactly:
            deviceClassName: gpu.nvidia.com
      config:
        - requests: ["ts-gpu"]
          opaque:
            driver: gpu.nvidia.com
            parameters:
              apiVersion: resource.nvidia.com/v1beta1
              kind: GpuConfig
              sharing:
                strategy: TimeSlicing
                timeSlicingConfig:
                  interval: Long   # Default | Short | Medium | Long
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-timesliced
  namespace: ch03-gpu-sharing
spec:
  terminationGracePeriodSeconds: 5
  nodeSelector:
    eks.amazonaws.com/capacityType: SPOT
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  resourceClaims:
    - name: shared
      resourceClaimTemplateName: timesliced-gpu
  containers:
    - name: ctr0
      image: nvcr.io/nvidia/k8s/cuda-sample:nbody-cuda11.7.1-ubuntu18.04
      command: ["bash", "-c"]
      args: ["nvidia-smi -L; trap 'exit 0' TERM; /tmp/sample --benchmark --numbodies=1000000 & wait"]
      resources:
        claims:
          - name: shared
            request: ts-gpu
    - name: ctr1
      image: nvcr.io/nvidia/k8s/cuda-sample:nbody-cuda11.7.1-ubuntu18.04
      command: ["bash", "-c"]
      args: ["nvidia-smi -L; trap 'exit 0' TERM; /tmp/sample --benchmark --numbodies=1000000 & wait"]
      resources:
        claims:
          - name: shared
            request: ts-gpu
