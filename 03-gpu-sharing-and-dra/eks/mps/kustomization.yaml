apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# First: kubectl label node <gpu-share-spot node> nvidia.com/device-plugin.config=mps-4 --overwrite
resources:
  - ../../common/mps
patches:
  - target:
      kind: Deployment
      name: mps-demo
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          eks.amazonaws.com/capacityType: SPOT
          nvidia.com/gpu.sharing-strategy: mps
