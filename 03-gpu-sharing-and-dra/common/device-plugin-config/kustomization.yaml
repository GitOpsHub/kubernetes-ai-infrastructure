apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sharing profiles for the NVIDIA device plugin managed by the GPU Operator (chapter 02).
# Wire it up with:
#   helm upgrade gpu-operator nvidia/gpu-operator -n gpu-operator --reuse-values \
#     --set devicePlugin.config.name=device-plugin-sharing --set devicePlugin.config.default=any
# then pick a profile per node with the label  nvidia.com/device-plugin.config=<key>
namespace: gpu-operator
resources:
  - configmap.yaml
