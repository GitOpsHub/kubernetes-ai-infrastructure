apiVersion: v1
kind: ConfigMap
metadata:
  name: device-plugin-sharing
data:
  # Default for nodes without the nvidia.com/device-plugin.config label: no sharing.
  any: |-
    version: v1
    flags:
      migStrategy: none
  # 4 time-sliced replicas per physical GPU. No memory or fault isolation.
  time-sliced-4: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: 4
  # 4 MPS clients per GPU. The plugin starts an MPS control daemon and caps each client
  # at ~1/4 of GPU memory and compute. Full GPUs only (not MIG), experimental upstream.
  mps-4: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      mps:
        renameByDefault: false
        resources:
          - name: nvidia.com/gpu
            replicas: 4
  # MIG profiles (A100/H100/H200/Blackwell only). Slices are created by MIG Manager
  # (label nvidia.com/mig.config=all-1g.10gb etc.) or by the cloud (AKS --gpu-instance-profile).
  mig-single: |-
    version: v1
    flags:
      migStrategy: single
  mig-mixed: |-
    version: v1
    flags:
      migStrategy: mixed
