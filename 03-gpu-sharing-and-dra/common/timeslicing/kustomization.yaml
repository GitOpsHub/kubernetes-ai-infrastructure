apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cloud-agnostic base: 4 pods that each ask for ONE nvidia.com/gpu.
# On a time-sliced node (replicas: 4 per physical GPU) all four land on a
# single physical GPU. Overlays add the cloud-specific nodeSelector/tolerations.
namespace: ch03-gpu-sharing
resources:
  - ../namespace
  - deployment.yaml
