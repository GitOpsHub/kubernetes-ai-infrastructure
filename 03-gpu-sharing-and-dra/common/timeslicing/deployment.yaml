apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeslice-demo
  labels:
    app: timeslice-demo
spec:
  replicas: 4
  selector:
    matchLabels:
      app: timeslice-demo
  template:
    metadata:
      labels:
        app: timeslice-demo
    spec:
      terminationGracePeriodSeconds: 5
      tolerations:
        # GKE/EKS/AKS GPU nodes are commonly tainted nvidia.com/gpu (value differs per cloud).
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cuda
          # N-body benchmark: keeps the GPU busy so you can watch contention in nvidia-smi / DCGM.
          image: nvcr.io/nvidia/k8s/cuda-sample:nbody-cuda11.7.1-ubuntu18.04
          command: ["bash", "-c"]
          args:
            - |
              nvidia-smi -L
              trap 'exit 0' TERM
              /tmp/sample --benchmark --numbodies=2000000 & wait
          resources:
            limits:
              nvidia.com/gpu: 1   # one *slot*, not one physical GPU, on a shared node
