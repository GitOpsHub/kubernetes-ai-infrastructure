apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ADVANCED / EXPENSIVE. First: ./aks/create-nodepool-mig.sh (PROFILE=MIG1g, A100/H100/H200 only),
# then install the NVIDIA device plugin + GFD with MIG_STRATEGY=single (README step 4c) -
# AKS's own --gpu-driver Install does NOT deploy a device plugin for you like the GPU Operator does.
resources:
  - ../../common/mig
patches:
  - target:
      kind: Deployment
      name: mig-demo
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.azure.com/scalesetpriority: spot
          nvidia.com/device-plugin.config: mig-single
      - op: add
        path: /spec/template/spec/tolerations/-
        value:
          key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
