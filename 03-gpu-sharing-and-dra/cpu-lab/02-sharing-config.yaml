# Mirrors common/dra/04-timeslicing-config.yaml, but exercises the example driver's OWN opaque
# config (gpu.resource.example.com/v1alpha1 GpuConfig) - TimeSlicing and SpacePartitioning are
# both implemented in-software by the example driver, so this teaches the DRA "vendor opaque
# config passthrough" mechanism without needing a real GPU or the NVIDIA driver's config schema.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: shared-gpus
spec:
  spec:
    devices:
      requests:
        - name: ts-gpu
          exactly:
            deviceClassName: gpu.example.com
        - name: sp-gpu
          exactly:
            deviceClassName: gpu.example.com
      config:
        - requests: ["ts-gpu"]
          opaque:
            driver: gpu.example.com
            parameters:
              apiVersion: gpu.resource.example.com/v1alpha1
              kind: GpuConfig
              sharing:
                strategy: TimeSlicing
                timeSlicingConfig:
                  interval: Long
        - requests: ["sp-gpu"]
          opaque:
            driver: gpu.example.com
            parameters:
              apiVersion: gpu.resource.example.com/v1alpha1
              kind: GpuConfig
              sharing:
                strategy: SpacePartitioning
                spacePartitioningConfig:
                  partitionCount: 10
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-cpu-sharing
spec:
  terminationGracePeriodSeconds: 5
  resourceClaims:
    - name: shared-gpus
      resourceClaimTemplateName: shared-gpus
  containers:
    - name: ts-ctr0
      image: ubuntu:22.04
      command: ["bash", "-c"]
      args: ["export | grep -i gpu; trap 'exit 0' TERM; sleep 9999 & wait"]
      resources:
        claims:
          - name: shared-gpus
            request: ts-gpu
    - name: ts-ctr1
      image: ubuntu:22.04
      command: ["bash", "-c"]
      args: ["export | grep -i gpu; trap 'exit 0' TERM; sleep 9999 & wait"]
      resources:
        claims:
          - name: shared-gpus
            request: ts-gpu
    - name: sp-ctr0
      image: ubuntu:22.04
      command: ["bash", "-c"]
      args: ["export | grep -i gpu; trap 'exit 0' TERM; sleep 9999 & wait"]
      resources:
        claims:
          - name: shared-gpus
            request: sp-gpu
