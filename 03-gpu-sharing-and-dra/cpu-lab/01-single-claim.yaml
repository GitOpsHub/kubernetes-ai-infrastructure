# Same shape as common/dra/01-single-gpu.yaml, against the simulated driver: one
# ResourceClaimTemplate -> one exclusive fake GPU per Pod.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: single-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.example.com   # created by dra-example-driver's DeviceClass
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-cpu-single
  labels:
    app: dra-cpu-single
spec:
  terminationGracePeriodSeconds: 5
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: single-gpu
  containers:
    - name: ctr0
      image: ubuntu:22.04
      command: ["bash", "-c"]
      # The example driver exports fake device info as env vars (no /dev/nvidia*, no CUDA).
      args: ["export | grep -i gpu; trap 'exit 0' TERM; sleep 9999 & wait"]
      resources:
        claims:
          - name: gpu
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-cpu-single-2
  labels:
    app: dra-cpu-single
spec:
  terminationGracePeriodSeconds: 5
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: single-gpu
  containers:
    - name: ctr0
      image: ubuntu:22.04
      command: ["bash", "-c"]
      args: ["export | grep -i gpu; trap 'exit 0' TERM; sleep 9999 & wait"]
      resources:
        claims:
          - name: gpu
