# Cloud-agnostic base: just the namespace + the scale-trigger Deployment used to observe node
# autoscaling. The actual autoscaler config (GKE ComputeClass / Karpenter NodePool+EC2NodeClass /
# AKS NAP NodePool+AKSNodeClass) is cluster-scoped and cloud-specific -- see gke/eks/aks.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch13-autoscale
labels:
- pairs:
    app.kubernetes.io/part-of: ch13-autoscale
  includeSelectors: false
resources:
- namespace.yaml
- scale-demo.yaml
