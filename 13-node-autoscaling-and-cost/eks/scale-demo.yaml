# A deliberately idle (replicas: 0) GPU workload you scale up by hand to WATCH node autoscaling
# happen -- this chapter is about the node layer, not the model, so the container just holds a
# GPU and sleeps (same base image/probe idea as chapter 09, without the weights download).
# `kubectl scale -n ch13-autoscale deploy/scale-demo --replicas=N` and time how long Pods stay
# Pending before a node appears (that number is what section 5's cost math is built on).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-demo
  namespace: ch13-autoscale
  labels:
    app.kubernetes.io/name: scale-demo
    app.kubernetes.io/part-of: ch13-autoscale
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: scale-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scale-demo
        app.kubernetes.io/part-of: ch13-autoscale
    spec:
      terminationGracePeriodSeconds: 10
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: hold-gpu
        image: nvidia/cuda:12.9.1-base-ubuntu24.04 # VERIFY: latest cuda base tag at pin time
        command: ["/bin/sh", "-c", "nvidia-smi || true; sleep infinity"]
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
            nvidia.com/gpu: "1"
          limits:
            memory: 2Gi
            nvidia.com/gpu: "1"
