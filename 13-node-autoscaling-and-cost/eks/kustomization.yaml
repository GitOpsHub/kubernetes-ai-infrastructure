# EKS: node capacity comes from Karpenter (installed + NodePool/EC2NodeClass applied by
# install-karpenter.sh, NOT by this kustomization -- those are cluster-scoped resources with
# ${EKS_CLUSTER} placeholders that need envsubst, so they're applied directly, same pattern as
# chapter 05's eksctl/az scripts). This kustomization only carries the scale-demo workload;
# its GPU-taint toleration is already in ../common/scale-demo.yaml, so no cloud patch is needed
# here beyond importing the base.
#   ./install-karpenter.sh                       # installs controller + gpu-spot/gpu-ondemand NodePools
#   kubectl apply -k 13-node-autoscaling-and-cost/eks
#   kubectl scale -n ch13-autoscale deploy/scale-demo --replicas=2   # watch Karpenter create nodes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../common
