# Same karpenter.sh/v1 NodePool API as eks/nodepool.yaml -- spot first (weight 10), on-demand
# fallback (weight 1). AKS's spot SKUs use `kubernetes.azure.com/scalesetpriority` OR the
# Karpenter-native `karpenter.sh/capacity-type` requirement; `# VERIFY` which one the AKS
# Karpenter provider expects at KARPENTER_VERSION (the OSS key is used here since NAP is
# explicitly "based on the open-source Karpenter... project" per Microsoft's own docs).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-spot
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: gpu
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["spot"]
      - key: node.kubernetes.io/instance-type
        operator: In
        # T4 first (cheap, widely available), A10 as an advanced fallback.
        values: ["Standard_NC4as_T4_v3", "Standard_NV36ads_A10_v5"]
      taints:
      - key: nvidia.com/gpu
        value: "present"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        value: spot
        effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "64"
    nvidia.com/gpu: "8"
  weight: 10
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-ondemand
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: gpu
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["Standard_NC4as_T4_v3"]
      taints:
      - key: nvidia.com/gpu
        value: "present"
        effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "16"
    nvidia.com/gpu: "2"
  weight: 1
