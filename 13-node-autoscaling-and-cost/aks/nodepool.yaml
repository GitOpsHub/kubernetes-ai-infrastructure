# Same karpenter.sh/v1 NodePool API as eks/nodepool.yaml -- spot first (weight 10), on-demand
# fallback (weight 1). Verified against Microsoft Learn's "Configure node pools for NAP" selector
# table: `karpenter.sh/capacity-type` (values spot/on-demand) IS the correct OSS Karpenter key on
# AKS NAP too. Corrected `node.kubernetes.io/instance-type` (not in AKS NAP's supported selector
# table) to `karpenter.azure.com/sku-name`, the Azure-provider-specific "explicit SKU name"
# selector -- the AWS-style `node.kubernetes.io/instance-type` label doesn't exist on AKS NAP nodes.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-spot
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: gpu
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["spot"]
      - key: karpenter.azure.com/sku-name
        operator: In
        # T4 first (cheap, widely available), A10 as an advanced fallback.
        values: ["Standard_NC4as_T4_v3", "Standard_NV36ads_A10_v5"]
      taints:
      - key: nvidia.com/gpu
        value: "present"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        value: spot
        effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "64"
    nvidia.com/gpu: "8"
  weight: 10
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-ondemand
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: gpu
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: karpenter.azure.com/sku-name
        operator: In
        values: ["Standard_NC4as_T4_v3"]
      taints:
      - key: nvidia.com/gpu
        value: "present"
        effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "16"
    nvidia.com/gpu: "2"
  weight: 1
