# AKS Node Auto Provisioning (NAP) runs Karpenter under the hood, so the NodePool CRD is the
# SAME karpenter.sh/v1 API as EKS/OSS Karpenter -- only the NodeClass is Azure-specific.
# apiVersion karpenter.azure.com/v1beta1 for AKSNodeClass verified via Microsoft Learn's
# node-auto-provisioning-aksnodeclass reference. Fields beyond imageFamily are less commonly
# documented -- `# VERIFY` osDiskSizeGB/maxPods against that page before depending on them.
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: gpu
spec:
  imageFamily: Ubuntu2204 # VERIFY: exact enum value at v1beta1
  osDiskSizeGB: 128 # VERIFY
