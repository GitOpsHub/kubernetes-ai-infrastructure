# GKE: relies on Node Auto-Provisioning (NAP) + the ComputeClass above, NOT a fixed node pool
# from chapter 01 -- the whole point of this chapter is nodes appearing/disappearing on demand.
#   ./enable-nap.sh
#   kubectl apply -k 13-node-autoscaling-and-cost/gke
#   kubectl scale -n ch13-autoscale deploy/scale-demo --replicas=2   # watch a node get created
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../common
- computeclass.yaml
patches:
- target: {kind: Deployment, name: scale-demo}
  path: patch-computeclass.yaml
