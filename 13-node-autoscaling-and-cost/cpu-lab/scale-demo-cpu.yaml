# CPU version of ../common/scale-demo.yaml: same "scale it up, watch a node appear" idea, sized
# so a few replicas comfortably exceed one small node's allocatable CPU and force the cluster
# autoscaler / Karpenter / NAP to add a node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-demo-cpu
  labels:
    app.kubernetes.io/name: scale-demo-cpu
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: scale-demo-cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scale-demo-cpu
    spec:
      containers:
      - name: hold-cpu
        image: busybox:1.36
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: "1500m"
            memory: 512Mi
          limits:
            memory: 1Gi
