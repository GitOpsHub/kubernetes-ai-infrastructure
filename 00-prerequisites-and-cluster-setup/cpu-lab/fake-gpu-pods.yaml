# Three pods each asking for 1 fake GPU. With COUNT=2 advertised, expect 2 Running + 1 Pending
# with "Insufficient nvidia.com/gpu". The container just sleeps: there is no GPU inside.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gpu-consumer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fake-gpu-consumer
  template:
    metadata:
      labels:
        app: fake-gpu-consumer
    spec:
      nodeSelector:
        fake-gpu: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: sleeper
        image: busybox:1.37.0
        command: ["sh", "-c", "echo 'I was scheduled against a fake GPU'; ls /dev/nvidia* 2>/dev/null || echo 'no /dev/nvidia* (expected)'; sleep 3600"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 16Mi
            nvidia.com/gpu: 1   # extended resources: set in limits (requests default to limits), no overcommit
