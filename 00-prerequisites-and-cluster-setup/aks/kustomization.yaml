apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../common
patches:
- target:
    kind: Deployment
    name: spot-smoke
  patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        kubernetes.azure.com/scalesetpriority: spot
    # Required on AKS: spot pools carry this taint automatically.
    - op: add
      path: /spec/template/spec/tolerations
      value:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule
