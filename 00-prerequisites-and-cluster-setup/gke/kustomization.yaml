apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../common
patches:
- target:
    kind: Deployment
    name: spot-smoke
  patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        cloud.google.com/gke-spot: "true"
    # GKE does not taint spot nodes by default; toleration is harmless and future-proofs
    # clusters where you add cloud.google.com/gke-spot=true:NoSchedule yourself.
    - op: add
      path: /spec/template/spec/tolerations
      value:
      - key: cloud.google.com/gke-spot
        operator: Equal
        value: "true"
        effect: NoSchedule
