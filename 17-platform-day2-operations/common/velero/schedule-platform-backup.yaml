# What's actually worth backing up on this platform (see README section 7):
#   - PVCs / model caches: chapter 05's shared-fs/object-storage PVCs, chapter 09's hf-cache PVC
#   - CRDs and the custom resources that carry real state: Kueue queues (06), KServe
#     InferenceServices (11), ArgoCD Applications (15) -- the DECLARATIVE state a GitOps repo can't
#     hand you back by itself if the cluster is gone (chapter 15's repo has the desired state, but
#     ArgoCD's own sync history/health/the live Application objects are cluster state)
#   - Secrets/ConfigMaps that aren't reproduced by a `kubectl apply -k` (generated, not GitOps'd)
# What's deliberately NOT here: etcd itself. GKE/EKS/AKS all manage the control plane and etcd for
# you -- there is no `etcdctl snapshot` step in this course because you have no access to etcd to
# snapshot, and the cloud's own control-plane SLA already covers it. Velero backs up the
# Kubernetes-API-visible objects and volume data, which is the part you're actually responsible for.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: platform-daily
  namespace: velero
spec:
  # Nightly at 02:00 cluster time -- see README RPO/RTO framing for why this schedule was chosen.
  schedule: "0 2 * * *"
  useOwnerReferencesInBackup: false
  template:
    includedNamespaces:
    - ch05-models
    - ch06-kueue
    - ch09-vllm
    - ch11-kserve
    - argocd
    excludedResources:
    # Job/Pod state churns constantly and is worthless to restore days later; the owning
    # Deployment/CronJob/TrainJob is what matters and is included by default.
    - events
    - events.events.k8s.io
    - pods.metrics.k8s.io
    snapshotVolumes: true
    defaultVolumesToFsBackup: false
    storageLocation: default
    ttl: 720h0m0s   # 30 days
