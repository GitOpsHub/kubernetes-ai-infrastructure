# One-off, on-demand Backup -- the pattern for "take a safety snapshot right before a risky
# change" (e.g. section 3's GPU Operator upgrade runbook, step 0). Not part of the daily Schedule;
# apply with a fresh `metadata.name` each time (Velero does not let you reuse a Backup name), or
# just use `velero backup create pre-gpu-operator-upgrade --from-schedule=platform-daily` instead
# of this file, which is the more common way to trigger an ad-hoc backup with the same template.
apiVersion: velero.io/v1
kind: Backup
metadata:
  name: pre-change-manual-example
  namespace: velero
  labels:
    purpose: pre-change-snapshot
spec:
  includedNamespaces:
  - gpu-operator
  - ch09-vllm
  snapshotVolumes: true
  defaultVolumesToFsBackup: false
  storageLocation: default
  ttl: 168h0m0s   # 7 days -- short-lived, superseded by the next nightly Schedule backup anyway
