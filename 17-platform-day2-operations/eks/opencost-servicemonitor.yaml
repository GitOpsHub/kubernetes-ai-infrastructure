# Same gotcha as 04-gpu-observability/eks/servicemonitor.yaml: kube-prometheus-stack's Prometheus CR
# only auto-discovers ServiceMonitor/PrometheusRule objects labeled `release: <helm release name>`
# (serviceMonitorSelectorNilUsesHelmValues/ruleSelectorNilUsesHelmValues: true, the chart default).
# This chapter's README section 5 installs kube-prometheus-stack's release as
# "kube-prometheus-stack" (matching chapter 04, same cluster) -- if you renamed it, relabel below.
# This scrapes OpenCost's OWN /metrics (cost-model internals: opencost_*), separate from DCGM's
# GPU telemetry chapter 04 already scrapes -- opencost-prometheusrule.yaml joins the two.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opencost
  namespace: opencost
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - opencost
  selector:
    matchLabels:
      app.kubernetes.io/name: opencost
  endpoints:
  # # VERIFY: port name against `kubectl get svc -n opencost -l app.kubernetes.io/name=opencost -o yaml`
  # -- opencost-helm-chart names the exporter API port "http" by default (apiPort 9003); confirm
  # after installing OpenCost (README section 5), chart internals move between releases.
  - port: http
    path: /metrics
    interval: 60s
