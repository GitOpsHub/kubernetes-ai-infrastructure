# 11-kserve's README (section 5, "Spot considerations") calls out that RawDeployment mode's plain
# Deployment has no built-in PDB and points at 09-llm-inference-with-vllm/eks/pdb.yaml as "the
# pattern" to copy if you run more than one replica. This is that PDB, filled in for chapter 11's
# generative LLMInferenceService pod (ch11-kserve namespace, KServe's standard
# `app: isvc.<name>-predictor` label on the pod it creates for an LLMInferenceService/InferenceService).
# Apply independently of the rest of this chapter, directly into chapter 11's own namespace:
#   kubectl apply -f 17-platform-day2-operations/eks/kserve-pdb.yaml
# # VERIFY: confirm the exact pod label KServe 0.20.0 sets on the LLMInferenceService's predictor
# pod for your deployed model name (`kubectl get pods -n ch11-kserve --show-labels`) and adjust
# matchLabels below if it differs -- the LLMInferenceService CRD is alpha and label conventions
# are not guaranteed stable (same caveat 11-kserve/README.md already flags for this API).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qwen3-0-6b-predictor
  namespace: ch11-kserve
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: isvc.qwen3-0-6b-predictor
