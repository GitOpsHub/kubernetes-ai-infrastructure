# A cheap stand-in for a "real" GPU workload so the drain/cordon lab (section 4, step 1) works on
# any cluster with no GPU quota and no cost. It exists only to have 3 pods spread across nodes that
# a PodDisruptionBudget can protect during `kubectl drain` -- the actual GPU case is step 2, which
# reuses chapter 09's real vLLM Deployment + PDB (09-llm-inference-with-vllm/eks/pdb.yaml)
# instead of re-implementing one here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drain-demo
  namespace: ch17-day2ops
  labels:
    app.kubernetes.io/name: drain-demo
    app.kubernetes.io/part-of: ch17-day2ops
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: drain-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drain-demo
        app.kubernetes.io/part-of: ch17-day2ops
    spec:
      # Spread across as many nodes as the cluster has, so draining one node actually evicts
      # only a subset of replicas -- the interesting case for a PDB.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: drain-demo
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 10
      containers:
      - name: workload
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
