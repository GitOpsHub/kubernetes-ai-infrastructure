# Load test the vLLM Service with the built-in benchmark client (vllm bench serve).
# Runs on a CPU node: we use the multi-arch CPU image so no GPU is required for the client.
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-bench
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-bench
    spec:
      restartPolicy: Never
      containers:
      - name: bench
        image: vllm/vllm-openai-cpu:v0.29.0
        command: ["vllm", "bench", "serve"]
        args:
        - --backend=openai                       # /v1/completions
        - --base-url=http://vllm:8000
        - --model=Qwen/Qwen3-0.6B                # must match the served model name; also used for the tokenizer
        - --dataset-name=random
        - --random-input-len=512
        - --random-output-len=128
        - --num-prompts=300
        - --max-concurrency=32                   # try 1, 8, 32, 64 and compare TTFT / throughput
        - --request-rate=inf
        - --ready-check-timeout-sec=900          # wait for the server to finish loading
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 4Gi
