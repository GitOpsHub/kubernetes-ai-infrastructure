# Cloud-agnostic vLLM base. Do not apply directly: use ../gke, ../eks or ../aks,
# which add the spot + GPU node selectors and cloud-specific vLLM flags.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch09-vllm
labels:
- pairs:
    app.kubernetes.io/part-of: ch09-vllm
  includeSelectors: false
resources:
- namespace.yaml
- vllm-deployment.yaml
- service.yaml
- pdb.yaml
