# Component: shard the model across 2 GPUs in the same node with tensor parallelism.
# Used by ../../../<cloud>/tp2. Switches to a model that actually needs 2 GPUs of the
# cheap tier: Qwen/Qwen3-8B (~16.4 GiB BF16 weights) does not fit a 24 GiB L4 with a
# useful KV cache, and does not fit a 16 GiB T4 at all.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    kind: Deployment
    name: vllm
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/0
      value: Qwen/Qwen3-8B
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --tensor-parallel-size=2
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests: {cpu: "8", memory: 48Gi, nvidia.com/gpu: "2"}
        limits: {memory: 64Gi, nvidia.com/gpu: "2"}
    # TP workers exchange tensors via NCCL, which uses /dev/shm between processes.
    - op: replace
      path: /spec/template/spec/volumes/1/emptyDir/sizeLimit
      value: 8Gi
    - op: replace
      path: /spec/template/spec/volumes/0/emptyDir/sizeLimit
      value: 60Gi
    # 16 GiB of weights take longer to download + load: allow 20 minutes.
    - op: replace
      path: /spec/template/spec/containers/0/startupProbe/failureThreshold
      value: 120
