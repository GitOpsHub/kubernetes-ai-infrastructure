# GKE: 1x L4 spot node (reuses the "spot-gpu" pool from 01-gpu-nodes-and-scheduling — create it
# first if you haven't: ../../01-gpu-nodes-and-scheduling/gke/create-gpu-nodepool.sh).
#   ../common/create-hf-secret.sh ch09-vllm
#   kubectl apply -k 09-llm-inference-with-vllm/gke
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../common
components:
- ../common/components/model-cache-pvc
patches:
- target:
    kind: Deployment
    name: vllm
  path: patch-spot.yaml
