# AKS + Kueue:  kubectl apply -k 07-distributed-training-kubeflow-trainer/kueue/aks
# Removes the hard spot nodeSelector so Kueue's ResourceFlavor (spot or on-demand
# fallback) decides the capacity type; keeps the GPU node-label selector and toleration.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../aks
components:
  - ../../common/kueue
patches:
  - target:
      group: trainer.kubeflow.org
      kind: TrainJob
    patch: |-
      - op: remove
        path: /spec/runtimePatches/0/trainingRuntimeSpec/template/spec/replicatedJobs/0/template/spec/template/spec/nodeSelector/kubernetes.azure.com~1scalesetpriority
