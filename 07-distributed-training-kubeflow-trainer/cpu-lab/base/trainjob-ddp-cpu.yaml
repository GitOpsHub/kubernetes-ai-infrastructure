# 2 nodes x 2 procs = 4 ranks, all CPU (gloo). Small model/batch so 4 ranks on
# small VMs finish in a couple of minutes. Same env knobs as common/trainjob-ddp-gpu.yaml.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: ddp-cpu
  labels:
    app.kubernetes.io/part-of: ch07
spec:
  runtimeRef:
    apiGroup: trainer.kubeflow.org
    kind: TrainingRuntime
    name: torch-ddp-cpu
  trainer:
    image: pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime
    command:
      - torchrun
      - /workspace/scripts/train_ddp.py
    numNodes: 2
    numProcPerNode: 2
    resourcesPerNode:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 3Gi
    env:
      - name: RUN_ID
        value: ddp-cpu
      - name: TOTAL_STEPS
        value: "2000"
      - name: CHECKPOINT_EVERY
        value: "100"
      - name: BATCH_SIZE
        value: "128"
      - name: STEP_SLEEP_SECONDS
        value: "0.2"   # slows the loop enough to `kubectl delete pod` mid-run and watch recovery
