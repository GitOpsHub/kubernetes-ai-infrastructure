# CPU counterpart of ../../common/base/trainingruntime-torch-ddp-spot.yaml.
# Same failurePolicy/backoffLimit shape (so you can practice the same
# preemption-and-resume drill), minus GPU requests and the CUDA image.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: torch-ddp-cpu
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 2
    torch: {}
  template:
    spec:
      failurePolicy:
        maxRestarts: 10
        restartStrategy: Recreate
      replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              backoffLimit: 0
              template:
                spec:
                  restartPolicy: Never
                  serviceAccountName: trainer
                  terminationGracePeriodSeconds: 25
                  containers:
                    - name: node
                      # No official pytorch/pytorch CPU-only tag exists (verified against
                      # Docker Hub) -- reuse the GPU lab's CUDA runtime image. It runs fine
                      # with no GPU present: torch.cuda.is_available() is False on these
                      # nodes, so train_ddp.py picks the gloo backend and CPU tensors.
                      image: pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime
                      volumeMounts:
                        - name: train-script
                          mountPath: /workspace/scripts
                        - name: dshm
                          mountPath: /dev/shm
                        - name: checkpoints
                          mountPath: /mnt/checkpoints
                  volumes:
                    - name: train-script
                      configMap:
                        name: ddp-train-script
                    - name: dshm
                      emptyDir:
                        medium: Memory
                        sizeLimit: 512Mi
                    - name: checkpoints   # emptyDir: lost when the pod is recreated -> you'll
                      emptyDir: {}        # SEE resume start from step 0 unless you patch in a PVC
