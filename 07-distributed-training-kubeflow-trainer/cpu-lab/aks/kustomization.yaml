# AKS: spot node pools carry an automatic NoSchedule taint -- toleration is required, not optional.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: patch-trainjob-aks.yaml
    target:
      group: trainer.kubeflow.org
      kind: TrainJob
      name: ddp-cpu
