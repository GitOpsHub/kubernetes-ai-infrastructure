- op: add
  path: /spec/runtimePatches
  value:
    - manager: ch07.lab/cloud-overlay-cpu
      trainingRuntimeSpec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  spec:
                    template:
                      spec:
                        nodeSelector:
                          kubernetes.azure.com/scalesetpriority: spot
                        tolerations:
                          - key: kubernetes.azure.com/scalesetpriority
                            operator: Equal
                            value: spot
                            effect: NoSchedule
