- op: add
  path: /spec/runtimePatches
  value:
    - manager: ch07.lab/cloud-overlay-cpu
      trainingRuntimeSpec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  spec:
                    template:
                      spec:
                        nodeSelector:
                          cloud.google.com/gke-spot: "true"
                        tolerations:
                          - key: cloud.google.com/gke-spot
                            operator: Equal
                            value: "true"
                            effect: NoSchedule
