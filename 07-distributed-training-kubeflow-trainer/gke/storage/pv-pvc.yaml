apiVersion: v1
kind: PersistentVolume
metadata:
  name: ch07-ddp-checkpoints
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 100Gi            # ignored by GCS FUSE, required by the API
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gcs-fuse-static   # any name; only used to bind PV <-> PVC
  mountOptions:
    - implicit-dirs
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: BUCKET_NAME           # replaced from storage.env
  claimRef:
    namespace: ch07-training
    name: ddp-checkpoints
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ddp-checkpoints
  namespace: ch07-training
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: gcs-fuse-static
  volumeName: ch07-ddp-checkpoints
