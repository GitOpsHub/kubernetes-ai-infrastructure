# GCS bucket mounted with the Cloud Storage FUSE CSI driver (static provisioning).
# Prereq: GcsFuseCsiDriver add-on enabled (see 05-model-storage-and-data or ../setup-storage.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pv-pvc.yaml
configMapGenerator:
  - name: ch07-storage-config
    envs:
      - storage.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"   # used for replacements only, never applied
replacements:
  - source:
      kind: ConfigMap
      name: ch07-storage-config
      fieldPath: data.BUCKET_NAME
    targets:
      - select:
          kind: PersistentVolume
          name: ch07-ddp-checkpoints
        fieldPaths:
          - spec.csi.volumeHandle
