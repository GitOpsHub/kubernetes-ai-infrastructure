# Adds a runtimePatch (Trainer v2.3 API) owned by "ch07.lab/cloud-overlay".
# runtimePatches are strategic-merge patches applied to the runtime's JobSet template.
- op: add
  path: /spec/runtimePatches
  value:
    - manager: ch07.lab/cloud-overlay
      trainingRuntimeSpec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  spec:
                    template:
                      metadata:
                        annotations:
                          gke-gcsfuse/volumes: "true"      # injects the GCS FUSE sidecar
                      spec:
                        nodeSelector:
                          cloud.google.com/gke-spot: "true"
                          cloud.google.com/gke-accelerator: nvidia-l4
                        tolerations:
                          - key: nvidia.com/gpu             # GKE taints GPU nodes automatically
                            operator: Exists
                            effect: NoSchedule
                          - key: cloud.google.com/gke-spot  # only needed if you tainted the spot pool
                            operator: Equal
                            value: "true"
                            effect: NoSchedule
