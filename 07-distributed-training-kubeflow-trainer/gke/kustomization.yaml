# GKE: spot L4 GPUs + GCS checkpoints.   kubectl apply -k 07-distributed-training-kubeflow-trainer/gke
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - storage
patches:
  - path: patch-trainjob-gke.yaml
    target:
      group: trainer.kubeflow.org
      kind: TrainJob
      name: ddp-gpu
