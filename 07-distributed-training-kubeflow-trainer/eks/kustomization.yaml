# EKS: spot g6 (L4) GPUs + S3 checkpoints.   kubectl apply -k 07-distributed-training-kubeflow-trainer/eks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - storage
patches:
  - path: patch-trainjob-eks.yaml
    target:
      group: trainer.kubeflow.org
      kind: TrainJob
      name: ddp-gpu
