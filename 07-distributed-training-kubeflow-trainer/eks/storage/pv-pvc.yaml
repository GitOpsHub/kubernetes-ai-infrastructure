apiVersion: v1
kind: PersistentVolume
metadata:
  name: ch07-ddp-checkpoints
spec:
  capacity:
    storage: 100Gi              # ignored, required
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""          # required for static provisioning
  claimRef:
    namespace: ch07-training
    name: ddp-checkpoints
  mountOptions:
    - allow-delete              # checkpoint retention deletes old files
    - region us-east-1          # replaced from storage.env
    - prefix ddp/               # keep lab objects under one prefix
  csi:
    driver: s3.csi.aws.com
    volumeHandle: ch07-ddp-checkpoints   # must be unique in the cluster
    volumeAttributes:
      bucketName: BUCKET_NAME            # replaced from storage.env
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ddp-checkpoints
  namespace: ch07-training
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  volumeName: ch07-ddp-checkpoints
