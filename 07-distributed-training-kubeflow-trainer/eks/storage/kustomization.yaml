# S3 bucket mounted with Mountpoint for Amazon S3 CSI driver (static provisioning).
# Prereq: aws-mountpoint-s3-csi-driver add-on (../setup-storage.sh or 05-model-storage-and-data).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pv-pvc.yaml
configMapGenerator:
  - name: ch07-storage-config
    envs:
      - storage.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
replacements:
  - source:
      kind: ConfigMap
      name: ch07-storage-config
      fieldPath: data.BUCKET_NAME
    targets:
      - select:
          kind: PersistentVolume
          name: ch07-ddp-checkpoints
        fieldPaths:
          - spec.csi.volumeAttributes.bucketName
  - source:
      kind: ConfigMap
      name: ch07-storage-config
      fieldPath: data.MOUNT_REGION
    targets:
      - select:
          kind: PersistentVolume
          name: ch07-ddp-checkpoints
        fieldPaths:
          - spec.mountOptions.1
