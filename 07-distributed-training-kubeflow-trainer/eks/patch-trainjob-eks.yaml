- op: add
  path: /spec/runtimePatches
  value:
    - manager: ch07.lab/cloud-overlay
      trainingRuntimeSpec:
        template:
          spec:
            replicatedJobs:
              - name: node
                template:
                  spec:
                    template:
                      spec:
                        nodeSelector:
                          eks.amazonaws.com/capacityType: SPOT   # set automatically on managed node groups
                          ch07.lab/gpu: l4                       # set by the eksctl create nodegroup command in README §4.3
                        tolerations:
                          - key: nvidia.com/gpu                  # taint added by that same nodegroup command
                            operator: Exists
                            effect: NoSchedule
