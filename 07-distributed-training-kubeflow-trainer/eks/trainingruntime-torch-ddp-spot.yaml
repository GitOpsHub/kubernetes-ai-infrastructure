# A namespaced TrainingRuntime = the "platform team" contract for spot training.
# It is the built-in torch-distributed ClusterTrainingRuntime (Trainer v2.3.0,
# manifests/base/runtimes/torch_distributed.yaml) plus spot-friendly failure handling:
#   * backoffLimit: 0 on each Job -> one lost pod fails that Job immediately
#   * JobSet failurePolicy.maxRestarts -> the WHOLE gang is recreated, every rank
#     re-rendezvouses and resumes from the last checkpoint (static DDP world size
#     cannot continue with a missing rank).
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: torch-ddp-spot
  namespace: ch07-training
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 2
    torch: {}
  template:
    spec:
      failurePolicy:
        maxRestarts: 10
        restartStrategy: Recreate
      replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              backoffLimit: 0
              template:
                spec:
                  restartPolicy: Never
                  serviceAccountName: trainer
                  # Give torchrun time to forward SIGTERM and rank 0 time to upload
                  # a checkpoint. EKS gives ~2 min of spot notice.
                  terminationGracePeriodSeconds: 25
                  containers:
                    - name: node
                      image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-runtime
                      volumeMounts:
                        - name: train-script
                          mountPath: /workspace/scripts
                        - name: dshm
                          mountPath: /dev/shm
                        - name: checkpoints
                          mountPath: /mnt/checkpoints
                  volumes:
                    - name: train-script
                      configMap:
                        name: ddp-train-script
                    - name: dshm          # NCCL/DataLoader need more than the 64Mi default /dev/shm
                      emptyDir:
                        medium: Memory
                        sizeLimit: 1Gi
                    - name: checkpoints   # PVC bound to the S3 bucket, see eks/pv-pvc.yaml
                      persistentVolumeClaim:
                        claimName: ddp-checkpoints
