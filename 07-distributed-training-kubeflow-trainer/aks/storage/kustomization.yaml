# Azure Blob container mounted with the Blob CSI driver (static provisioning).
# Prereq: Blob CSI driver enabled (../setup-storage.sh or 05-model-storage-and-data).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pv-pvc.yaml
configMapGenerator:
  - name: ch07-storage-config
    envs:
      - storage.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"   # used for replacements only, never applied
replacements:
  - source:
      kind: ConfigMap
      name: ch07-storage-config
      fieldPath: data.AZ_STORAGE_RG
    targets:
      - select:
          kind: PersistentVolume
          name: ch07-ddp-checkpoints
        fieldPaths:
          - spec.csi.volumeAttributes.resourceGroup
      - select:
          kind: PersistentVolume
          name: ch07-ddp-checkpoints
        fieldPaths:
          - spec.csi.volumeHandle
        options:
          delimiter: "#"
          index: 0
  - source:
      kind: ConfigMap
      name: ch07-storage-config
      fieldPath: data.AZ_STORAGE_ACCOUNT
    targets:
      - select:
          kind: PersistentVolume
          name: ch07-ddp-checkpoints
        fieldPaths:
          - spec.csi.volumeAttributes.storageAccount
      - select:
          kind: PersistentVolume
          name: ch07-ddp-checkpoints
        fieldPaths:
          - spec.csi.volumeHandle
        options:
          delimiter: "#"
          index: 1
  - source:
      kind: ConfigMap
      name: ch07-storage-config
      fieldPath: data.AZ_CONTAINER
    targets:
      - select:
          kind: PersistentVolume
          name: ch07-ddp-checkpoints
        fieldPaths:
          - spec.csi.volumeAttributes.containerName
      - select:
          kind: PersistentVolume
          name: ch07-ddp-checkpoints
        fieldPaths:
          - spec.csi.volumeHandle
        options:
          delimiter: "#"
          index: 2
