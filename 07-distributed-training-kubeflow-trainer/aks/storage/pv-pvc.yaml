# Azure Blob container mounted with the Blob CSI driver (blobfuse2, static provisioning),
# authenticated via the AKS kubelet managed identity (see ../setup-storage.sh) -- no
# clientID/secretRef needed on the PV itself.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ch07-ddp-checkpoints
  annotations:
    pv.kubernetes.io/provisioned-by: blob.csi.azure.com
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 100Gi           # ignored by blobfuse2, required by the API
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""       # required for static provisioning
  mountOptions:
    - -o allow_other
    - --file-cache-timeout-in-seconds=120
    - --use-attr-cache=true
    - --log-level=LOG_WARNING
  csi:
    driver: blob.csi.azure.com
    # {resource-group}#{account}#{container} -- must be unique per container in the cluster
    volumeHandle: "RG#ACCOUNT#CONTAINER"
    volumeAttributes:
      protocol: fuse2
      resourceGroup: REPLACED_BY_KUSTOMIZE
      storageAccount: REPLACED_BY_KUSTOMIZE
      containerName: REPLACED_BY_KUSTOMIZE
  claimRef:
    namespace: ch07-training
    name: ddp-checkpoints
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ddp-checkpoints
  namespace: ch07-training
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ""
  volumeName: ch07-ddp-checkpoints
