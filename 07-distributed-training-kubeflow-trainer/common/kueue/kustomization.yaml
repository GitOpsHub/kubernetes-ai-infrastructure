# Kustomize Component: submit the TrainJob through Kueue.
#  * adds kueue.x-k8s.io/queue-name -> Kueue's webhook suspends the TrainJob until admitted
#  * adds the LocalQueue
# Kueue then writes its own runtimePatch (manager kueue.x-k8s.io/manager) with the
# nodeSelector/tolerations of the ResourceFlavor it admitted the job into.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - localqueue.yaml
patches:
  - target:
      group: trainer.kubeflow.org
      kind: TrainJob
    patch: |-
      - op: add
        path: /metadata/labels/kueue.x-k8s.io~1queue-name
        value: ch07-queue
