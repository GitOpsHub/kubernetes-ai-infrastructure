# Identity for training pods. Cloud overlays bind it to bucket permissions:
#  GKE: Workload Identity Federation principal (no annotation needed)
#  EKS: Mountpoint for S3 uses the CSI driver's identity (see eks/setup-storage.sh)
#  AKS: blobfuse2 uses the kubelet managed identity (see aks/setup-storage.sh)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trainer
