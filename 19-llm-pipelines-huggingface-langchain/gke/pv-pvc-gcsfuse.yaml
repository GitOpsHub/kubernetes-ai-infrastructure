# Static PV: volumeHandle = bucket name (injected from bucket.env by kustomize replacements).
# One PV for every pod; the pod's KSA decides read/write (IAM on the bucket, setup-gcs-iam.sh).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ch19-model-store-gcs
spec:
  accessModes: ["ReadWriteMany"]
  capacity:
    storage: 256Gi                 # ignored by the driver, required by Kubernetes
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: ch19-pipelines
    name: model-store
  mountOptions:
    - implicit-dirs                # "directories" that exist only as object prefixes
    # finite metadata TTL so readers (vLLM's wait-for-model, finetune's resume scan) notice new
    # _COMPLETE markers written by other pods
    - metadata-cache:ttl-secs:60
    # file cache + parallel downloads: big win for multi-GB safetensors read once at startup
    - file-cache:max-size-mb:-1
    - file-cache:cache-file-for-range-read:true
    - file-cache:enable-parallel-downloads:true
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: REPLACED_BY_KUSTOMIZE
    volumeAttributes:
      gcsfuseLoggingSeverity: warning
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-store
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: ch19-model-store-gcs
  resources:
    requests:
      storage: 256Gi
