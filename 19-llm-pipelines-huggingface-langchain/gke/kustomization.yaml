# GKE: model-store = GCS bucket mounted with the Cloud Storage FUSE CSI driver; identity via
# Workload Identity Federation for GKE (IAM granted directly to the KSA principals pipeline-runner
# (objectUser) and model-reader (objectViewer) -- no Google service account, no KSA annotation).
#   CPU steps, TEI, rag-api -> spot CPU pool "ch19-cpu-spot" (install.sh)
#   finetune, evaluate, vLLM -> the L4 "spot-gpu" pool from 01-gpu-nodes-and-scheduling
#
# Order:  ./install.sh  ./setup-gcs-iam.sh  ./build-push-artifact-registry.sh
#         ../../09-llm-inference-with-vllm/common/create-hf-secret.sh ch19-pipelines   (optional)
#         kubectl apply -k 19-llm-pipelines-huggingface-langchain/gke
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch19-pipelines
resources:
  - ../common
  - pv-pvc-gcsfuse.yaml
configMapGenerator:
  - name: storage-params
    envs: [bucket.env]              # written by setup-gcs-iam.sh
    options:
      disableNameSuffixHash: true
  - name: ch19-images
    envs: [images.env]              # written by build-push-artifact-registry.sh
    options:
      disableNameSuffixHash: true
  - name: serving-params
    behavior: merge
    envs: [serving.env]
replacements:
  # images.env -> every WorkflowTemplate step that runs the trainer image. Replacements, not the
  # `images:` transformer: kustomize's image transformer doesn't know Argo's spec.templates[].
  - source: {kind: ConfigMap, name: ch19-images, fieldPath: data.TRAINER_IMAGE}
    targets:
      - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
        fieldPaths:
          - "spec.templates.[name=finetune].container.image"
          - "spec.templates.[name=evaluate].container.image"
          - "spec.templates.[name=publish].container.image"
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.GCS_BUCKET}
    targets:
      - select: {kind: PersistentVolume, name: ch19-model-store-gcs}
        fieldPaths: [spec.csi.volumeHandle]
patches:
  # Workflow level: spot selector + the gcsfuse annotation via spec.podMetadata (Argo copies it
  # onto every step pod; the CSI driver's webhook only injects its sidecar into annotated pods).
  - target: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    path: patch-workflow-gke.yaml
  - target: {kind: WorkflowTemplate, name: langchain-batch-inference}
    path: patch-workflow-gke.yaml
  - target: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    path: patch-finetune-gpu.yaml
  - target: {kind: Deployment, name: vllm}
    path: patch-gpu-spot.yaml
  - target: {kind: Deployment, name: tei}
    path: patch-cpu-spot.yaml
  - target: {kind: Deployment, name: rag-api}
    path: patch-cpu-spot.yaml
