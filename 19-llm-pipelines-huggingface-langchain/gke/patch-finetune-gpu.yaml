# Index-based JSON6902 (2 = finetune, 3 = evaluate), guarded by `test` ops -- see the header of
# common/training/workflowtemplate-hf-finetune.yaml. GKE taints GPU nodes nvidia.com/gpu=present
# automatically; the matching toleration is already in common.
- op: test
  path: /spec/templates/2/name
  value: finetune
- op: add
  path: /spec/templates/2/nodeSelector
  value:
    cloud.google.com/gke-spot: "true"
    cloud.google.com/gke-accelerator: nvidia-l4   # nvidia-tesla-t4 if your ch01 pool is T4
- op: test
  path: /spec/templates/3/name
  value: evaluate
- op: add
  path: /spec/templates/3/nodeSelector
  value:
    cloud.google.com/gke-spot: "true"
    cloud.google.com/gke-accelerator: nvidia-l4
