# CPU-only lab: the whole chapter on any cluster (kind, minikube, a CPU node pool) with no GPU and
# no cloud account. What changes vs the GPU overlays:
#   - model-store is a plain ReadWriteOnce PVC (default StorageClass) instead of a bucket. Fine here:
#     only Workflow pods mount it and they run one after another (the two pull steps run in parallel
#     but on a single-node cluster share the node).
#   - SmolLM2-135M-Instruct instead of Qwen3-0.6B, a 20-step fine-tune, CPU torch trainer image
#     (build-load-kind.sh), no GPU requests / tolerations / /dev/shm.
#   - no vLLM: rag-api and the batch pipeline call chapter 09's cpu-lab Ollama (qwen3:0.6b):
#       kubectl apply -k 09-llm-inference-with-vllm/cpu-lab
#   - TEI (embeddings, from common) is published for linux/amd64 only (ghcr.io/huggingface/
#     text-embeddings-inference:cpu-1.9.4). On an arm64 kind/minikube node (Apple silicon) it runs
#     only if the Docker VM emulates amd64 (Rosetta/qemu binfmt) -- slowly; otherwise it fails with
#     "exec format error" and rag-api stays unready.
# Order:  ./install.sh  ./build-load-kind.sh  kubectl apply -k 19-llm-pipelines-huggingface-langchain/cpu-lab
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch19-pipelines
resources:
  - ../common
  - pvc.yaml
configMapGenerator:
  - name: pipeline-params
    behavior: replace               # whole file: SmolLM2 + small CPU-sized knobs + Ollama endpoint
    envs: [params.env]
    options:
      disableNameSuffixHash: true
  - name: ch19-images
    envs: [images.env]              # written by build-load-kind.sh
    options:
      disableNameSuffixHash: true
# Replacements run after this kustomization's generators, so they see the cpu-lab values:
#  1. params.env -> WorkflowTemplate defaults (same block as common/kustomization.yaml; re-run so
#     SmolLM2 / Ollama replace the GPU values common already wrote there)
#  2. images.env -> trainer image of finetune / evaluate / publish
replacements:
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.MODEL_ID}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=model-id].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.MODEL_REVISION}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=model-revision].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.DATASET_ID}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=dataset-id].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.DATASET_REVISION}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=dataset-revision].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.MAX_STEPS}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=max-steps].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.MAX_EVAL_LOSS}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=max-eval-loss].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.OPENAI_BASE_URL}
  targets:
  - select: {kind: WorkflowTemplate, name: langchain-batch-inference}
    fieldPaths: ["spec.arguments.parameters.[name=openai-base-url].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.CHAT_MODEL}
  targets:
  - select: {kind: WorkflowTemplate, name: langchain-batch-inference}
    fieldPaths: ["spec.arguments.parameters.[name=chat-model].value"]
- source: {kind: ConfigMap, name: ch19-images, fieldPath: data.TRAINER_IMAGE}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths:
    - "spec.templates.[name=finetune].container.image"
    - "spec.templates.[name=evaluate].container.image"
    - "spec.templates.[name=publish].container.image"
patches:
  - path: patch-delete-vllm.yaml
  - target: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    path: patch-cpu-steps.yaml
