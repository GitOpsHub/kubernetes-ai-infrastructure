# Plain block-storage PVC from the cluster's default StorageClass (kind: local-path).
# ReadWriteOnce is enough: only the Workflow step pods mount it, one step at a time.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-store
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
