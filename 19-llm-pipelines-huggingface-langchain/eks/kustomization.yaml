# EKS (primary cloud for this chapter).
#   model-store  = S3 bucket mounted with the Mountpoint for Amazon S3 CSI driver (v2), pod-level
#                  credentials via EKS Pod Identity (pipeline-runner: read/write, model-reader: read)
#   CPU steps, TEI, rag-api -> spot CPU node group "ch19-cpu-spot" (nodegroup-ch19.yaml)
#   finetune, evaluate, vLLM -> the "spot-gpu" node group from 01-gpu-nodes-and-scheduling
#
# Order (all inlined bash in the README's Lab section, no separate scripts):
#   Step 1  CPU spot node group + Argo Workflows with ch19-pipelines watched
#   Step 2  bucket, Pod Identity roles/associations, CSI add-on -> bucket.env
#   Step 3  trainer image -> ECR -> images.env
#   Step 4  kubectl create secret generic hf-token ...    (optional)
#   Step 5  kubectl apply -k 19-llm-pipelines-huggingface-langchain/eks
#
# GPU budget: 01's spot-gpu group has maxSize 1. vLLM and the finetune/evaluate steps each want a
# whole GPU, so scale vLLM to 0 while the pipeline trains (or raise maxSize to 2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch19-pipelines
resources:
  - ../common
  - pv-pvc-mountpoint.yaml
configMapGenerator:
  - name: storage-params
    envs: [bucket.env]              # written by Step 2's IAM/Pod Identity block
    options:
      disableNameSuffixHash: true
  - name: ch19-images
    envs: [images.env]              # written by Step 3's build block
    options:
      disableNameSuffixHash: true
  - name: serving-params
    behavior: merge                 # edit serving.env to serve the fine-tuned model
    envs: [serving.env]
replacements:
  # images.env -> every WorkflowTemplate step that runs the trainer image. Replacements, not the
  # `images:` transformer: kustomize's image transformer doesn't know Argo's spec.templates[].
  - source: {kind: ConfigMap, name: ch19-images, fieldPath: data.TRAINER_IMAGE}
    targets:
      - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
        fieldPaths:
          - "spec.templates.[name=finetune].container.image"
          - "spec.templates.[name=evaluate].container.image"
          - "spec.templates.[name=publish].container.image"
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.S3_BUCKET}
    targets:
      - select: {kind: PersistentVolume, name: ch19-model-store-s3}
        fieldPaths: [spec.csi.volumeAttributes.bucketName]
patches:
  # Workflow-level spot selector: every step that doesn't set its own (all CPU steps).
  - target: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    path: patch-workflow-spot.yaml
  - target: {kind: WorkflowTemplate, name: langchain-batch-inference}
    path: patch-workflow-spot.yaml
  # GPU steps: template-level selector (Argo: template nodeSelector REPLACES the workflow one).
  - target: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    path: patch-finetune-gpu.yaml
  - target: {kind: Deployment, name: vllm}
    path: patch-gpu-spot.yaml
  - target: {kind: Deployment, name: tei}
    path: patch-cpu-spot.yaml
  - target: {kind: Deployment, name: rag-api}
    path: patch-cpu-spot.yaml
