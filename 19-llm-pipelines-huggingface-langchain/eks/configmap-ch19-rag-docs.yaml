apiVersion: v1
data:
  keda-autoscaling.md: |
    # Autoscaling inference with KEDA

    CPU-based autoscaling doesn't work for GPU inference. A vLLM pod's CPU barely moves while its
    GPU is saturated. The course scales on **queue depth** instead: vLLM's Prometheus metric
    `vllm:num_requests_waiting` (requests queued that the current batch hasn't started yet).

    ## HPA vs KEDA

    - **HPA v2 + prometheus-adapter**: the adapter exposes a PromQL rule as a custom metric
      (`custom.metrics.k8s.io`) that the HPA polls. It can't scale to zero: `minReplicas` must be
      at least 1.
    - **KEDA**: a `ScaledObject` CRD with built-in scalers (`prometheus`, `cpu`, `cron`, many more)
      that query the source directly. Above `minReplicaCount` it creates and manages an HPA for you.
      Below it, including to and from **zero**, KEDA scales the Deployment itself.

    The course's ScaledObject for vLLM uses a `prometheus` trigger with the query
    `sum(vllm:num_requests_waiting{...})`, `threshold: "5"`, `activationThreshold: "0.5"`,
    `minReplicaCount: 0`, `maxReplicaCount: 4`, `cooldownPeriod: 300` and a 300 s scale-down
    stabilization window.

    ## Cold starts are the price of scale-to-zero

    Going from 0 to 1 GPU replica isn't like scaling a web pod:

    - node provisioning (if the GPU pool is at 0): 1-8 minutes
    - image pull (if not cached on the node): 10 s to 2 minutes
    - weight load (on a cache miss): 10 s to 2 minutes for a small model
    - CUDA graph capture plus KV cache allocation: 10-60 s

    Best case is about 30-60 s. Worst case, with a cold node and cold cache, is 5-12 minutes. Use
    scale-to-zero for dev and batch-style traffic. Keep `minReplicaCount: 1` for latency-sensitive
    APIs, and make the first request's client timeout long enough.

    ## Pending pods after scale-up

    KEDA or the HPA only create pods. If no GPU node has room, the pod stays `Pending` until the node
    autoscaler (Karpenter on EKS, NAP on GKE/AKS) provisions one. Check both layers when a scale-out
    seems stuck.
  kueue-gpu-queues.md: |
    # Sharing GPUs fairly with Kueue

    Kueue is an **admission** layer in front of the Kubernetes scheduler. It doesn't schedule pods.
    It decides *when a whole job may start*, based on quota. A job that targets Kueue is created
    suspended (`spec.suspend: true`) and only unsuspended once there is quota for all of its pods.

    ## Object model

    - **ResourceFlavor**: a named kind of node (node labels, taints/tolerations), such as a "spot"
      flavor and an "on-demand" flavor. Cluster-scoped, no quota of its own.
    - **ClusterQueue**: cluster-scoped quota holder. `spec.resourceGroups[].flavors[]` lists flavors
      **in preference order**, each with a `nominalQuota` and optional `borrowingLimit` /
      `lendingLimit`. Putting the spot flavor first gives you spot-first scheduling.
    - **Cohort**: a group of ClusterQueues that lend unused quota to each other. Since the
      `kueue.x-k8s.io/v1beta2` API it is its own CRD and carries the fair-sharing weight.
    - **LocalQueue**: namespaced, and points at one ClusterQueue. Users submit to this.
    - **Workload**: created automatically by Kueue for every queued job. You read Workloads, you
      don't write them.
    - **WorkloadPriorityClass**: sets queue order and preemption only. Independent of the
      Kubernetes PriorityClass.

    ## Submitting a job

    Add the label `kueue.x-k8s.io/queue-name: <local-queue>` to the Job. Kueue's webhook suspends
    it, creates a Workload, and releases the job when the ClusterQueue admits it.

    ## Borrowing and preemption

    When team A's ClusterQueue is idle, team B can **borrow** its quota through the shared Cohort.
    When team A submits work again, Kueue can **preempt** the borrowed workloads to give the quota
    back. That lets scarce GPUs stay busy without one team starving another.

    ## Debugging a pending job

    `kubectl get workloads -n <ns>` and `kubectl describe clusterqueue <name>` show whether a job is
    waiting for quota (not yet admitted) or was admitted but its pods can't be scheduled (usually a
    node selector or toleration problem).
  model-storage.md: |
    # Model storage: getting weights to the pod

    An LLM server needs a large image **plus** model weights (1 GB to over 1 TB) on every pod start.
    Pods start on every scale-up, every rollout and every spot reclaim. Treat model delivery like
    artifact distribution: immutable, versioned, least-privilege, cached close to the nodes.

    ## Bucket-backed volumes

    Each cloud mounts object storage as a volume through a CSI driver with keyless identity:

    | Cloud | Driver | Identity |
    |---|---|---|
    | GKE | Cloud Storage FUSE CSI | Workload Identity Federation for GKE |
    | EKS | Mountpoint for Amazon S3 CSI | EKS Pod Identity (`authenticationSource: pod`) |
    | AKS | Azure Blob CSI (blobfuse2) | Azure Workload Identity |

    ## Write rules for bucket mounts

    Mountpoint for S3 writes **new files only**. By default it can't overwrite, delete or rename, and
    GCS FUSE renames on flat buckets are a non-atomic copy plus delete. So on this platform:

    - Download or train into local scratch (an `emptyDir`) first, then copy the files onto the
      mount sequentially as new files. Tools like `hf download` write temp files and rename them,
      which fails on Mountpoint.
    - Store models under an immutable path that includes the pinned revision, for example
      `hf/models/Qwen/Qwen3-0.6B/<commit-sha>/`. Pin revisions to commit SHAs, not `main`.
    - Write a `_COMPLETE` marker file **last**. Readers treat a directory without it as invalid, so
      a copy interrupted by a spot reclaim is never served.
    - An `Operation not permitted` error when copying onto an existing file means you're
      overwriting on Mountpoint. Use a new path instead.

    ## Separate writer and reader identities

    Only loader jobs and pipelines get write access to the bucket. Serving pods such as vLLM use a
    read-only identity and mount the volume `readOnly`. With `authenticationSource: pod`, the
    Mountpoint process uses the workload pod's own ServiceAccount, so two pods sharing one PV can
    still get different S3 permissions.
  spot-gpu-nodes.md: |
    # Spot GPU nodes on this platform

    Every GPU in this course runs on **spot capacity** by default, with on-demand as the documented
    fallback. Spot is much cheaper, but the cloud can reclaim a node with very little notice. So
    every GPU workload here has to tolerate a restart.

    ## How a pod lands on a GPU node

    A pod needs three things before the scheduler will place it on a spot GPU node:

    1. **A GPU request**: `resources.limits: nvidia.com/gpu: 1`. The NVIDIA device plugin advertises
       this extended resource on the node.
    2. **A toleration for the GPU taint** `nvidia.com/gpu=present:NoSchedule`. GKE adds this taint
       to GPU pools automatically. On EKS the `spot-gpu` node group sets it explicitly.
    3. **A node selector** for the right capacity type:
       - GKE: `cloud.google.com/gke-spot: "true"`
       - EKS: `eks.amazonaws.com/capacityType: SPOT`, plus `nvidia.com/gpu.present: "true"`
       - AKS: `kubernetes.azure.com/scalesetpriority: spot`

    **AKS is the odd one out.** Every AKS spot pool is auto-tainted with
    `kubernetes.azure.com/scalesetpriority=spot:NoSchedule`, so AKS pods also need a toleration for
    that taint. GKE and EKS don't add a spot taint. Forget the toleration and the pod
    stays `Pending` without any obvious error.

    ## Keeping cost at zero when idle

    GPU node pools are created with **min nodes = 0**. They only cost money while a GPU pod is
    pending or running. On EKS the `spot-gpu` node group uses `g4dn.xlarge` instances.
    The default lab keeps it to a single cheap GPU class so idle cost stays low and the node group stays easy to reason about.
    per availability zone, so more eligible shapes means fewer stockouts.

    ## Surviving a reclaim

    - Keep `terminationGracePeriodSeconds` below the tightest spot notice window you run on
      (GKE ~15 s for regular pods, AKS ~30 s, EC2 ~2 min).
    - Training must checkpoint to durable storage and resume from the last *complete* checkpoint.
    - Batch pipelines should retry the failed step (for example an Argo `retryStrategy`) instead of
      rerunning the whole pipeline.
    - T4 GPUs (`g4dn`) have no bf16 support, so training falls back to fp16 there.
  vllm-serving.md: |
    # Serving LLMs with vLLM

    The platform serves models with **vLLM**, which exposes an **OpenAI-compatible API**
    (`/v1/models`, `/v1/chat/completions`) on port 8000. Any OpenAI client (the `openai` SDK,
    LangChain's `ChatOpenAI`) can talk to it by changing `base_url`. The CPU lab uses Ollama, which
    speaks the same OpenAI-style contract, on port 11434.

    ## Why the probes look unusual

    - **startupProbe**: `/health` with `failureThreshold: 60` x `periodSeconds: 10`, a 10-minute
      budget. Downloading weights, capturing CUDA graphs and allocating the KV cache can take
      minutes. Liveness and readiness are suppressed until the startup probe passes, so a slow boot
      isn't killed as unhealthy.
    - **readinessProbe**: `/health` on a short interval. The pod only gets traffic once the engine
      can serve.
    - **terminationGracePeriodSeconds: 25** with `--shutdown-timeout=10` and a short `preStop`
      sleep, sized to fit inside the tightest spot notice window.

    ## GPU memory and the KV cache

    vLLM pre-allocates most of the GPU's free memory at startup. `--gpu-memory-utilization=0.90`
    reserves ~90% for weights, activations and a paged **KV cache** pool. That memory shows as used
    even when idle: it is capacity for concurrent sequences, not a leak. If startup fails with
    `CUDA out of memory`, lower it to 0.80-0.85. If the model plus `--max-model-len` doesn't fit,
    reduce `--max-model-len` (the course uses 8192) or `--max-num-seqs`.

    ## Deployment shape

    A single-GPU vLLM Deployment uses `strategy: Recreate`, not RollingUpdate. A rolling update
    would need a second GPU while the old pod is still running. With `replicas: 1`, a spot reclaim
    is a real outage until a new node and pod are up.

    `--served-model-name` sets the name clients pass as `model`. This decouples clients from the
    weights' path, so you can swap in a fine-tuned model without changing callers.

    ## Qwen3 thinking mode

    Qwen3 models emit a `<think>...</think>` reasoning block by default. With vLLM, pass
    `chat_template_kwargs: {"enable_thinking": false}` in the request body to switch it off for
    short, direct answers.
