# Three identities, least privilege on purpose (same idea as chapter 05's writer/reader split):
#   pipeline-runner  every Argo Workflow pod (pull / finetune / evaluate / publish / batch):
#                    bucket READ + WRITE, plus the Argo executor RBAC in rbac-argo-executor.yaml
#   model-reader     vLLM: bucket READ-ONLY (it only ever loads a finished model)
#   rag-api          the LangChain API: no cloud permissions at all (it talks to vLLM/TEI over HTTP)
# pipeline-runner and model-reader are bound to IAM roles via EKS Pod Identity in the README's
# Step 2 (setup-s3-iam block) -- see bucket.env.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: ch19-pipelines
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-reader
  namespace: ch19-pipelines
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-api
  namespace: ch19-pipelines
automountServiceAccountToken: false   # never calls the Kubernetes API
