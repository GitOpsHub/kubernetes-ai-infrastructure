# AKS: model-store = Azure Blob container mounted with the Blob CSI driver (blobfuse2),
# authenticated with Azure Workload Identity (user-assigned managed identity + federated
# credentials for pipeline-runner and model-reader) -- same pattern as chapter 05.
#   CPU steps, TEI, rag-api -> spot user pool "ch19spot" (install.sh)
#   finetune, evaluate, vLLM -> the T4 "gpuspot" pool from 01-gpu-nodes-and-scheduling
# AKS taints spot pools kubernetes.azure.com/scalesetpriority=spot:NoSchedule automatically, so
# EVERY pod here needs that toleration in addition to the selector.
#
# Order:  ./install.sh  ./setup-blob-iam.sh  ./build-push-acr.sh
#         ../../09-llm-inference-with-vllm/common/create-hf-secret.sh ch19-pipelines   (optional)
#         kubectl apply -k 19-llm-pipelines-huggingface-langchain/aks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch19-pipelines
resources:
  - ../common
  - pv-pvc-blob.yaml
configMapGenerator:
  - name: storage-params
    envs: [bucket.env]              # written by setup-blob-iam.sh
    options:
      disableNameSuffixHash: true
  - name: ch19-images
    envs: [images.env]              # written by build-push-acr.sh
    options:
      disableNameSuffixHash: true
  - name: serving-params
    behavior: merge
    envs: [serving.env]
replacements:
  # images.env -> every WorkflowTemplate step that runs the trainer image. Replacements, not the
  # `images:` transformer: kustomize's image transformer doesn't know Argo's spec.templates[].
  - source: {kind: ConfigMap, name: ch19-images, fieldPath: data.TRAINER_IMAGE}
    targets:
      - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
        fieldPaths:
          - "spec.templates.[name=finetune].container.image"
          - "spec.templates.[name=evaluate].container.image"
          - "spec.templates.[name=publish].container.image"
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.AZ_STORAGE_RG}
    targets:
      - select: {kind: PersistentVolume, name: ch19-model-store-blob}
        fieldPaths: [spec.csi.volumeAttributes.resourceGroup]
      - select: {kind: PersistentVolume, name: ch19-model-store-blob}
        fieldPaths: [spec.csi.volumeHandle]
        options: {delimiter: "#", index: 0}
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.AZ_STORAGE_ACCOUNT}
    targets:
      - select: {kind: PersistentVolume, name: ch19-model-store-blob}
        fieldPaths: [spec.csi.volumeAttributes.storageAccount]
      - select: {kind: PersistentVolume, name: ch19-model-store-blob}
        fieldPaths: [spec.csi.volumeHandle]
        options: {delimiter: "#", index: 1}
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.AZ_CONTAINER}
    targets:
      - select: {kind: PersistentVolume, name: ch19-model-store-blob}
        fieldPaths: [spec.csi.volumeAttributes.containerName]
      - select: {kind: PersistentVolume, name: ch19-model-store-blob}
        fieldPaths: [spec.csi.volumeHandle]
        options: {delimiter: "#", index: 2}
  - source: {kind: ConfigMap, name: storage-params, fieldPath: data.AZ_MI_CLIENT_ID}
    targets:
      - select: {kind: PersistentVolume, name: ch19-model-store-blob}
        fieldPaths: [spec.csi.volumeAttributes.clientID]
patches:
  - target: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    path: patch-workflow-spot.yaml
  - target: {kind: WorkflowTemplate, name: langchain-batch-inference}
    path: patch-workflow-spot.yaml
  - target: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    path: patch-finetune-gpu.yaml
  - target: {kind: Deployment, name: vllm}
    path: patch-gpu-spot.yaml
  - target: {kind: Deployment, name: tei}
    path: patch-cpu-spot.yaml
  - target: {kind: Deployment, name: rag-api}
    path: patch-cpu-spot.yaml
