apiVersion: v1
kind: PersistentVolume
metadata:
  name: ch19-model-store-blob
  annotations:
    pv.kubernetes.io/provisioned-by: blob.csi.azure.com
spec:
  accessModes: ["ReadWriteMany"]
  capacity:
    storage: 256Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: ch19-pipelines
    name: model-store
  mountOptions:
    - -o allow_other
    - --file-cache-timeout-in-seconds=120
    - --use-attr-cache=true
    - --cancel-list-on-mount-seconds=10
    - -o attr_timeout=120
    - -o entry_timeout=120
    - -o negative_timeout=10       # short: readers must notice new _COMPLETE markers
    - --log-level=LOG_WARNING
  csi:
    driver: blob.csi.azure.com
    # {resource-group}#{account}#{container} – must be unique per container in the cluster
    volumeHandle: "RG#ACCOUNT#CONTAINER"
    volumeAttributes:
      protocol: fuse2                     # blobfuse2
      resourceGroup: REPLACED_BY_KUSTOMIZE
      storageAccount: REPLACED_BY_KUSTOMIZE
      containerName: REPLACED_BY_KUSTOMIZE
      # Workload identity: the driver exchanges the *pod's* ServiceAccount token for this identity.
      clientID: REPLACED_BY_KUSTOMIZE
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-store
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: ch19-model-store-blob
  resources:
    requests:
      storage: 256Gi
