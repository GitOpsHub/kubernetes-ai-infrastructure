# Chapter-19 cloud-agnostic base. Do not apply directly: use ../eks (primary), ../gke, ../aks or
# ../cpu-lab, which add the bucket-backed PVC "model-store", spot/GPU node selection and the real
# trainer image. `kubectl kustomize` here is still useful to read the whole chapter in one file.
#
# The ConfigMaps built from src/** live HERE rather than in base/: kustomize only reads files at or
# below the directory holding the kustomization.yaml, and src/ is a sibling of base/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch19-pipelines
labels:
- pairs:
    app.kubernetes.io/part-of: ch19-pipelines
  includeSelectors: false
resources:
  - base
  - training
  - batch
  - serving
configMapGenerator:
  # No hash suffix on any of these: Argo WorkflowTemplates reference ConfigMaps by name and
  # kustomize only knows how to rewrite names inside core kinds (Deployment, Pod, ...), not CRDs.
  - name: ch19-scripts                    # mounted at /opt/ch19 in the hf-pull step
    files:
      - src/hf_pull.py
    options:
      disableNameSuffixHash: true
  - name: ch19-langchain-app              # mounted at /opt/app (rag-api, batch-infer)
    files:
      - src/langchain_app/rag_chain.py
      - src/langchain_app/rag_api.py
      - src/langchain_app/batch_infer.py
    options:
      disableNameSuffixHash: true
  - name: ch19-rag-docs                   # the RAG corpus, mounted at /opt/rag-docs
    files:
      - src/langchain_app/docs/keda-autoscaling.md
      - src/langchain_app/docs/kueue-gpu-queues.md
      - src/langchain_app/docs/model-storage.md
      - src/langchain_app/docs/spot-gpu-nodes.md
      - src/langchain_app/docs/vllm-serving.md
    options:
      disableNameSuffixHash: true
  - name: ch19-prompts                    # seed input for the batch pipeline
    files:
      - src/langchain_app/prompts.jsonl
    options:
      disableNameSuffixHash: true
# params.env (ConfigMap pipeline-params) -> the WorkflowTemplates' default arguments, so
# `argo submit --from workflowtemplate/...` with no -p flags runs exactly what params.env says.
# cpu-lab regenerates pipeline-params (behavior: replace) and repeats this block so the replacement
# re-runs against its own values. (Not a shared kustomize Component: a component can't render on
# its own, and scripts/validate-all.sh renders every kustomization.yaml in the repo.)
replacements:
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.MODEL_ID}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=model-id].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.MODEL_REVISION}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=model-revision].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.DATASET_ID}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=dataset-id].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.DATASET_REVISION}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=dataset-revision].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.MAX_STEPS}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=max-steps].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.MAX_EVAL_LOSS}
  targets:
  - select: {kind: WorkflowTemplate, name: hf-finetune-pipeline}
    fieldPaths: ["spec.arguments.parameters.[name=max-eval-loss].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.OPENAI_BASE_URL}
  targets:
  - select: {kind: WorkflowTemplate, name: langchain-batch-inference}
    fieldPaths: ["spec.arguments.parameters.[name=openai-base-url].value"]
- source: {kind: ConfigMap, name: pipeline-params, fieldPath: data.CHAT_MODEL}
  targets:
  - select: {kind: WorkflowTemplate, name: langchain-batch-inference}
    fieldPaths: ["spec.arguments.parameters.[name=chat-model].value"]
