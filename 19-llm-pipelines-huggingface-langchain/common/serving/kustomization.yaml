# Online serving: vLLM (GPU) + TEI embeddings (CPU) + LangChain RAG API (CPU).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch19-pipelines
resources:
  - vllm-deployment.yaml
  - tei-deployment.yaml
  - rag-api-deployment.yaml
configMapGenerator:
  # Hash suffix kept ON: kustomize rewrites the Deployment's configMapKeyRef to the new name, so
  # changing MODEL_PATH triggers a vLLM rollout on the next apply.
  - name: serving-params
    envs: [serving.env]
