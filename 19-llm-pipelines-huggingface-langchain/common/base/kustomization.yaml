# Shared pieces for every chapter-19 workload: namespace, identities, Argo executor RBAC,
# pipeline parameters. The ConfigMaps built from ../src/** (scripts, LangChain app, RAG docs) are
# generated one level up in ../kustomization.yaml -- kustomize refuses to read files outside the
# directory that holds the kustomization, and src/ is not below base/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ch19-pipelines
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - rbac-argo-executor.yaml
configMapGenerator:
  - name: pipeline-params
    envs: [params.env]
    options:
      disableNameSuffixHash: true   # referenced by name from WorkflowTemplates (envFrom) and replacements
