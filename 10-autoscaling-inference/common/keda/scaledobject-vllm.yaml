# KEDA drives the SAME Deployment's replica count from a raw PromQL query (no custom-metrics API
# needed) and — unlike the plain HPA — can scale to 0. KEDA creates/manages an HPA object for you
# once minReplicaCount > 0 activation is met; below that it scales the Deployment directly.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm
  namespace: ch09-vllm
spec:
  scaleTargetRef:
    name: vllm
  minReplicaCount: 0
  maxReplicaCount: 4
  # Poll less often than the HPA's default 15s controller loop would — Prometheus itself only
  # scrapes vLLM every 15s (ServiceMonitor above), polling faster just re-reads stale data.
  pollingInterval: 15
  # How long a scaled-to-0 workload waits with metric > 0 before KEDA actually scales it up from 0 —
  # separate from the cooldown below, which governs the trip back down to 0.
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
      query: sum(vllm:num_requests_waiting{namespace="ch09-vllm"})
      threshold: "5"
      # Below this, treat the metric as "0 traffic" and let the workload scale to 0 instead of
      # sitting at 1 replica forever on a rounding sliver of the query result.
      activationThreshold: "0.5"
