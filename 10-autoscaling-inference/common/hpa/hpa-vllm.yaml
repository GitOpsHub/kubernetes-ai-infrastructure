# HPA v2 on a custom metric served by prometheus-adapter (custom.metrics.k8s.io), sourced from
# vLLM's own `vllm:num_requests_waiting` gauge (see README "Which metric" table). Cannot scale to 0
# — autoscaling/v2 HPAs require minReplicas >= 1. For scale-to-zero use ../keda instead.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm
  namespace: ch09-vllm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Pods
    pods:
      metric:
        name: vllm_num_requests_waiting
      target:
        type: AverageValue
        averageValue: "5"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleDown:
      # Slow scale-down: a GPU pod that scales down then back up a minute later just pays the cold
      # start twice. See README "Cold-start math" before tuning this.
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
