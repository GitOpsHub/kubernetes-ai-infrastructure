# Scales chapter 09's cpu-lab Ollama Deployment (namespace ch09-vllm-cpu) on plain CPU utilization —
# no Prometheus needed, works on any cluster. The `cpu` trigger CANNOT scale to 0 by itself (KEDA
# requires pairing it with a non-resource trigger for that — see README "cpu-lab vs GPU lab"), so
# this demonstrates scale-OUT under load, not scale-to-zero.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ollama
  namespace: ch09-vllm-cpu
spec:
  scaleTargetRef:
    name: ollama
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "60"
