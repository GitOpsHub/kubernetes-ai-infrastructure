# Hammer the Ollama OpenAI-compatible endpoint with concurrent chat requests to drive CPU up and
# trigger the ScaledObject above. Plain curl in a loop, no extra image to build.
apiVersion: batch/v1
kind: Job
metadata:
  name: load-generator
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
    spec:
      restartPolicy: Never
      containers:
      - name: load
        image: curlimages/curl:8.11.1
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          for i in $(seq 1 200); do
            curl -s -o /dev/null -m 30 http://ollama.ch09-vllm-cpu.svc:11434/v1/chat/completions \
              -H 'Content-Type: application/json' \
              -d '{"model":"qwen3:0.6b","messages":[{"role":"user","content":"Write two sentences about Kubernetes."}]}' &
          done
          wait
        resources:
          requests:
            cpu: "200m"
            memory: 128Mi
          limits:
            memory: 256Mi
