# AKS: patches the "spot" ResourceFlavor with both the nodeLabel AND the toleration AKS spot
# pools require (AKS taints spot nodes automatically with
# kubernetes.azure.com/scalesetpriority=spot:NoSchedule). ResourceFlavor.spec.tolerations lets
# Kueue inject that toleration into admitted pods, so the Job specs themselves never need one.
#   ./create-nodepool.sh
#   ./install-kueue.sh
#   kubectl apply -k 06-batch-jobs-and-kueue/aks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common/base
  - ../common/flavors
  - ../common/queues
patches:
  - target: {kind: ResourceFlavor, name: spot}
    patch: |-
      - op: replace
        path: /spec/nodeLabels
        value:
          kubernetes.azure.com/scalesetpriority: spot
      - op: add
        path: /spec/tolerations
        value:
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule
  - target: {kind: ResourceFlavor, name: on-demand}
    patch: |-
      - op: replace
        path: /spec/nodeLabels
        value:
          agentpool: ch06ondemand
