# GKE: patches the "spot" ResourceFlavor to match GKE Spot VM nodes and the "on-demand" flavor
# to the standard node pool.
#   ./create-nodepool.sh            # spot pool (default) + on-demand pool
#   ./install-kueue.sh              # helm install, controller pinned to the on-demand pool
#   kubectl apply -k 06-batch-jobs-and-kueue/gke
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common/base
  - ../common/flavors
  - ../common/queues
patches:
  - target: {kind: ResourceFlavor, name: spot}
    patch: |-
      - op: replace
        path: /spec/nodeLabels
        value:
          cloud.google.com/gke-spot: "true"
  - target: {kind: ResourceFlavor, name: on-demand}
    patch: |-
      - op: replace
        path: /spec/nodeLabels
        value:
          cloud.google.com/gke-nodepool: ch06-cpu-ondemand
