# team-b has a much smaller nominal quota - it relies on borrowing team-a's unused spot quota
# most of the time, then reclaims its own via preemption when it actually needs it (Step 3 of the lab).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: team-b-cq
spec:
  cohortName: ch06-cohort
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: spot
          resources:
            - name: "cpu"
              nominalQuota: 1
              borrowingLimit: 4
            - name: "memory"
              nominalQuota: 2Gi
              borrowingLimit: 8Gi
        - name: on-demand
          resources:
            - name: "cpu"
              nominalQuota: 1
            - name: "memory"
              nominalQuota: 2Gi
  preemption:
    reclaimWithinCohort: LowerPriority
    borrowWithinCohort:
      policy: LowerPriority
      maxPriorityThreshold: 10000
    withinClusterQueue: LowerOrNewerEqualPriority
