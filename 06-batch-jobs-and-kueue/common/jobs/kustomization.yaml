# Cloud-agnostic on purpose: Kueue's admission webhook injects the ResourceFlavor's nodeLabels
# (and, on AKS, tolerations) into each admitted pod automatically - these Job specs never need a
# per-cloud nodeSelector/toleration patch the way chapter 05's raw Deployments did.
# Apply individually (kubectl apply -f <file>) rather than as one kustomization, so the lab can
# submit them in a specific order to observe queueing/preemption. Fixed names (not generateName)
# so `kubectl delete -f <file>` / re-apply is easy to script and this dir still kustomize-builds.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - job-simple.yaml
  - job-indexed-spot.yaml
  - job-high-priority.yaml
