apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ch15-mlflow
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ai-platform
  sources:
    - repoURL: "https://community-charts.github.io/helm-charts"
      chart: mlflow
      targetRevision: "1.11.7"   # = MLFLOW_CHART_VERSION in versions.env (app 3.16.0) — Argo CD can't read it, keep in sync by hand
      helm:
        valueFiles:
          - $values/15-mlops-gitops-and-pipelines/common/mlflow/values-mlflow-aks.yaml
    - repoURL: "https://github.com/YOUR_ORG/kubernetes-ai-infrastructure.git"   # VERIFY
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: mlflow
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
