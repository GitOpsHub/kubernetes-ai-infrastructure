# Multi-source: Source 1 is the upstream OCI Helm chart, Source 2 is THIS git repo providing
# just the values file chapter 06 already wrote — replaces `install-kueue.sh` with a
# declarative, drift-corrected install. Kueue's own workload objects (queues/flavors/jobs)
# stay as a separate Application (app-kueue-queues.yaml) so RBAC/sync-waves can differ.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ch15-kueue
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ai-platform
  sources:
    - repoURL: oci://registry.k8s.io/kueue/charts/kueue
      chart: kueue
      targetRevision: "0.19.4"   # KUEUE_VERSION from versions.env — Argo CD sources can't ${env}-expand, keep in sync by hand
      helm:
        valueFiles:
          - $values/06-batch-jobs-and-kueue/common/values-kueue.yaml
    - repoURL: "https://github.com/YOUR_ORG/kubernetes-ai-infrastructure.git"   # VERIFY: your fork's clone URL
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kueue-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # No "automated:" block by default — see README §3.2 for why this course ships app-of-apps
    # in manual-sync mode and how to flip individual apps to automated once you trust them.
