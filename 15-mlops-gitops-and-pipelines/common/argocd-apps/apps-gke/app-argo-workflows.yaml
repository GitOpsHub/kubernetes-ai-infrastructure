apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ch15-argo-workflows
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ai-platform
  sources:
    - repoURL: "https://argoproj.github.io/argo-helm"
      chart: argo-workflows
      targetRevision: "2.0.6"   # ARGO_WORKFLOWS_CHART_VERSION (app v4.1.3) — not in versions.env, see README
      helm:
        valueFiles:
          - $values/15-mlops-gitops-and-pipelines/common/workflows/values-argo-workflows.yaml
    - repoURL: "https://github.com/YOUR_ORG/kubernetes-ai-infrastructure.git"   # VERIFY
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
