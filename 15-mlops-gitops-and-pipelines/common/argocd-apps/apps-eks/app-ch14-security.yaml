# Deploys chapter 14's namespaces/quotas/RBAC/NetworkPolicy/admission-policy stack via GitOps
# instead of `kubectl apply -k`. This is the app that makes app-of-apps itself accountable to
# the same review process as any other change: a PR touching 14-multi-tenancy-and-security
# shows up as an Argo CD OutOfSync diff before anyone runs `kubectl`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ch15-multi-tenancy-security
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ai-platform
  source:
    repoURL: "https://github.com/YOUR_ORG/kubernetes-ai-infrastructure.git"   # VERIFY
    targetRevision: main
    path: 14-multi-tenancy-and-security/eks
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ch14-team-a   # multi-namespace app; Argo CD applies each object's own namespace
