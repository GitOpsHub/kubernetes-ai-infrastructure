apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ch15-kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ai-platform
  sources:
    - repoURL: "https://prometheus-community.github.io/helm-charts"
      chart: kube-prometheus-stack
      targetRevision: "91.4.1"   # KUBE_PROMETHEUS_STACK_VERSION
      helm:
        valueFiles:
          - $values/04-gpu-observability/eks/values-kube-prometheus-stack.yaml
    - repoURL: "https://github.com/YOUR_ORG/kubernetes-ai-infrastructure.git"   # VERIFY
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
