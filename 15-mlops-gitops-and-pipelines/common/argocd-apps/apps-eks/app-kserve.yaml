apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ch15-kserve
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after kserve-crd (wave 0)
spec:
  project: ai-platform
  source:
    repoURL: oci://ghcr.io/kserve/charts/kserve-resources
    chart: kserve-resources
    targetRevision: "v0.20.0"   # KSERVE_VERSION
    helm:
      parameters:
        - name: kserve.controller.deploymentMode
          value: "Standard"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kserve
