# No cloud object storage: artifacts land on the same PVC as the SQLite backend store. Fine
# for the lab; swap in artifactRoot.{gcs,s3,azureBlob} once you're on a real cloud (see
# ../gke/eks/aks values files) so artifacts survive a PVC loss independent of the database.
backendStore:
  defaultSqlitePath: /mlflow/data/mlflow.db
artifactRoot:
  proxiedArtifactStorage: true
  defaultArtifactRoot: /mlflow/data/artifacts
service:
  type: ClusterIP
  port: 5000
persistence:
  enabled: true
  size: 5Gi
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "1", memory: 1Gi}
