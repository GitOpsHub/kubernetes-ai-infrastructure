apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ch15-kserve-crd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ai-platform
  source:
    repoURL: oci://ghcr.io/kserve/charts/kserve-crd
    chart: kserve-crd
    targetRevision: "v0.20.0"   # KSERVE_VERSION
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kserve
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
