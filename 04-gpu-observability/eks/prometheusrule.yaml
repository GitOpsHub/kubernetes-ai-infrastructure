# GPU alerts on DCGM metrics. Metric names verified against the DCGM exporter default metric
# set (deployment/etc/default-counters.csv in NVIDIA/dcgm-exporter, image tag matching
# ${DCGM_EXPORTER_CHART_VERSION}=4.8.3 pinned in chapter 02's ClusterPolicy).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-alerts
  namespace: ch04-observability
  labels:
    release: kube-prometheus-stack   # required for kube-prometheus-stack's default ruleSelector
    app.kubernetes.io/part-of: gpu-observability
spec:
  groups:
    - name: gpu.rules
      rules:
        - alert: GPUHighTemperature
          # DCGM_FI_DEV_GPU_TEMP is Celsius. 85C is a conservative pre-thermal-throttle warning
          # line for datacenter L4/T4/A100 parts; check your GPU's spec sheet and tune per fleet.
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} is running hot"
            description: "DCGM_FI_DEV_GPU_TEMP = {{ $value }}C for 5m. Check airflow/cooling and colocated workloads."

        - alert: GPUXidError
          # A nonzero XID count is a driver/hardware fault (Xid docs: NVIDIA GPU driver Xid errors).
          # Fires once per scrape interval the counter increases - see runbook link in the README.
          expr: increase(DCGM_FI_DEV_XID_ERRORS[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "XID error on GPU {{ $labels.gpu }} ({{ $labels.Hostname }})"
            description: "DCGM_FI_DEV_XID_ERRORS increased in the last 5m. XID 13/31/48/63/64/74/79 usually mean the GPU needs draining and a node reset; see NVIDIA Xid Errors docs."

        - alert: GPUMemoryNearFull
          # FB (framebuffer) used vs. used+free, i.e. actual VRAM pressure, not process count.
          expr: |
            (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) > 0.95
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} memory >95% for 10m"
            description: "Framebuffer memory on {{ $labels.Hostname }} GPU {{ $labels.gpu }} is nearly exhausted. Expect OOM kills on time-sliced/MPS clients (chapter 03) before whole-GPU workloads."

        - alert: GPULowUtilizationOnDemandNode
          # Idle on-demand GPU nodes are the single biggest avoidable AI infra cost. Doesn't fire
          # on spot nodes (those should scale to zero on idle instead - chapter 13).
          expr: |
            avg_over_time(DCGM_FI_DEV_GPU_UTIL[30m]) < 5
            and on (Hostname) (kube_node_labels{label_eks_amazonaws_com_capacityType!="SPOT", label_cloud_google_com_gke_spot!="true", label_kubernetes_azure_com_scalesetpriority!="spot"})
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "On-demand GPU node {{ $labels.Hostname }} has been <5% utilized for 30m"
            description: "Consider scaling this node pool down, moving the workload to spot, or right-sizing (chapter 13: node autoscaling and cost)."
            # VERIFY: kube_state_metrics label names for spot/capacity-type vary by kube-state-metrics
            # version and by whether node labels are on the kube-state-metrics allow-list (see
            # values-kube-prometheus-stack.yaml kubeStateMetrics.metricLabelsAllowlist). Confirm the
            # exact label keys against `kubectl get --raw /metrics | grep kube_node_labels` in your
            # cluster before enabling this rule.

        - alert: DCGMExporterDown
          # job label = the target Service's name by default (ServiceMonitor spec.jobLabel unset
          # -> "nvidia-dcgm-exporter"); update this if you set jobLabel in servicemonitor.yaml.
          expr: up{job="nvidia-dcgm-exporter"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "dcgm-exporter target down on {{ $labels.instance }}"
            description: "Prometheus hasn't scraped dcgm-exporter for 10m. GPU alerting is blind until this recovers - check the DaemonSet and the ServiceMonitor's endpoint."
