# A CPU-only stand-in for dcgm-exporter: serves the same metric names on the same port/path so
# the ServiceMonitor, PrometheusRule alerts, and Grafana dashboard from common/ all work without
# any GPU or the NVIDIA GPU Operator. Values drift with sin()/counters, not real telemetry -
# this teaches the observability plumbing, not GPU behavior.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-dcgm-exporter-script
data:
  serve.py: |
    import http.server, math, time, random

    START = time.time()
    XID_TOGGLE_AFTER = 300  # seconds: flip on an XID error once, to test the alert firing

    def metrics():
        t = time.time() - START
        util = 40 + 35 * math.sin(t / 60)
        fb_total = 24000  # MiB, L4-sized
        fb_used = max(0, min(fb_total, 6000 + 4000 * math.sin(t / 90)))
        power = 40 + 30 * (util / 100)
        temp = 45 + 25 * (util / 100)
        sm_clock = 800 + 400 * (util / 100)
        xid = 1 if t > XID_TOGGLE_AFTER and int(t) % 600 < 5 else 0
        labels = 'gpu="0",UUID="GPU-fake-00000000",Hostname="cpu-lab-node",device="nvidia0"'
        return "\n".join([
            "# HELP DCGM_FI_DEV_GPU_UTIL GPU utilization (%)",
            "# TYPE DCGM_FI_DEV_GPU_UTIL gauge",
            f'DCGM_FI_DEV_GPU_UTIL{{{labels}}} {util:.1f}',
            "# HELP DCGM_FI_DEV_FB_USED Framebuffer memory used (MiB)",
            "# TYPE DCGM_FI_DEV_FB_USED gauge",
            f'DCGM_FI_DEV_FB_USED{{{labels}}} {fb_used:.0f}',
            "# HELP DCGM_FI_DEV_FB_FREE Framebuffer memory free (MiB)",
            "# TYPE DCGM_FI_DEV_FB_FREE gauge",
            f'DCGM_FI_DEV_FB_FREE{{{labels}}} {fb_total - fb_used:.0f}',
            "# HELP DCGM_FI_DEV_POWER_USAGE Power draw (W)",
            "# TYPE DCGM_FI_DEV_POWER_USAGE gauge",
            f'DCGM_FI_DEV_POWER_USAGE{{{labels}}} {power:.1f}',
            "# HELP DCGM_FI_DEV_GPU_TEMP GPU temperature (C)",
            "# TYPE DCGM_FI_DEV_GPU_TEMP gauge",
            f'DCGM_FI_DEV_GPU_TEMP{{{labels}}} {temp:.1f}',
            "# HELP DCGM_FI_DEV_SM_CLOCK SM clock (MHz)",
            "# TYPE DCGM_FI_DEV_SM_CLOCK gauge",
            f'DCGM_FI_DEV_SM_CLOCK{{{labels}}} {sm_clock:.0f}',
            "# HELP DCGM_FI_DEV_XID_ERRORS Last XID error code (0 = none)",
            "# TYPE DCGM_FI_DEV_XID_ERRORS gauge",
            f'DCGM_FI_DEV_XID_ERRORS{{{labels}}} {xid}',
        ]) + "\n"

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404); self.end_headers(); return
            body = metrics().encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, fmt, *args):
            pass

    http.server.HTTPServer(("0.0.0.0", 9400), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-dcgm-exporter
  labels:
    app: nvidia-dcgm-exporter   # matches common/servicemonitor's selector unchanged
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  template:
    metadata:
      labels:
        app: nvidia-dcgm-exporter
    spec:
      containers:
        - name: fake-dcgm-exporter
          image: python:3.13-slim
          command: ["python3", "/opt/serve.py"]
          ports:
            - name: gpu-metrics
              containerPort: 9400
          volumeMounts:
            - name: script
              mountPath: /opt
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: script
          configMap:
            name: fake-dcgm-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-dcgm-exporter
  labels:
    app: nvidia-dcgm-exporter
spec:
  selector:
    app: nvidia-dcgm-exporter
  ports:
    - name: gpu-metrics
      port: 9400
      targetPort: gpu-metrics
