# Run after 00-prerequisites-and-cluster-setup/cpu-lab/advertise-fake-gpu.sh has given one CPU node
# nvidia.com/gpu=2, label fake-gpu=true and taint nvidia.com/gpu=present:NoSchedule.
# Predict each pod's outcome BEFORE applying. None of these containers can use a GPU.
---
# A: requests a GPU, no toleration -> Pending: untolerated taint {nvidia.com/gpu: present}
apiVersion: v1
kind: Pod
metadata:
  name: a-no-toleration
  labels: {drill: gpu-scheduling}
spec:
  containers:
  - name: c
    image: busybox:1.37.0
    command: ["sleep", "3600"]
    resources:
      limits: {nvidia.com/gpu: 1, memory: 16Mi}
      requests: {cpu: 10m, memory: 16Mi}
---
# B: tolerates, but selects a GPU model no node has -> Pending: didn't match node selector
apiVersion: v1
kind: Pod
metadata:
  name: b-wrong-model
  labels: {drill: gpu-scheduling}
spec:
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB   # GFD-style label (chapter 02); absent here
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: c
    image: busybox:1.37.0
    command: ["sleep", "3600"]
    resources:
      limits: {nvidia.com/gpu: 1, memory: 16Mi}
      requests: {cpu: 10m, memory: 16Mi}
---
# C: correct -> Running on the fake-gpu node
apiVersion: v1
kind: Pod
metadata:
  name: c-correct
  labels: {drill: gpu-scheduling}
spec:
  nodeSelector:
    fake-gpu: "true"
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: c
    image: busybox:1.37.0
    command: ["sleep", "3600"]
    resources:
      limits: {nvidia.com/gpu: 1, memory: 16Mi}
      requests: {cpu: 10m, memory: 16Mi}
---
# D: "toleration is permission, not attraction". Tolerates the GPU taint, requests NO GPU and has
# a preference for the GPU node. It lands there and eats CPU/memory on an expensive node.
# Real-world fix: don't give CPU workloads GPU tolerations (or use policy, chapter 14).
apiVersion: v1
kind: Pod
metadata:
  name: d-cpu-pod-on-gpu-node
  labels: {drill: gpu-scheduling}
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - {key: fake-gpu, operator: In, values: ["true"]}
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: c
    image: busybox:1.37.0
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 16Mi}
---
# E: invalid. requests != limits for an extended resource -> rejected by the API server at create time.
