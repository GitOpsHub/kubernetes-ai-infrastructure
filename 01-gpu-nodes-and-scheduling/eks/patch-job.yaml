- op: add
  path: /spec/template/spec/nodeSelector
  value:
    eks.amazonaws.com/capacityType: SPOT
    nvidia.com/gpu.present: "true"      # set at boot by nodeadm on the EKS AL2023 NVIDIA AMI
- op: add
  path: /spec/template/spec/tolerations
  value:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
