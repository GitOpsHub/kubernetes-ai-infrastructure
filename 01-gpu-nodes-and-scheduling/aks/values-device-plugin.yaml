# nvdp/nvidia-device-plugin chart values for AKS GPU pools.
# Default chart affinity requires feature.node.kubernetes.io/pci-10de.present (NFD) OR nvidia.com/gpu.present=true.
# AKS has no NFD by default, so create-gpu-nodepool.sh labels the pool nvidia.com/gpu.present=true.
tolerations:
- key: CriticalAddonsOnly
  operator: Exists
- key: nvidia.com/gpu
  operator: Exists
  effect: NoSchedule
# AKS spot pools are auto-tainted; without this the plugin never runs on spot GPU nodes
- key: kubernetes.azure.com/scalesetpriority
  operator: Equal
  value: spot
  effect: NoSchedule
gfd:
  enabled: false
