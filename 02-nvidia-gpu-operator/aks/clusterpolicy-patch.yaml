# Mirrors values-aks.yaml (full-stack: driver/toolkit/devicePlugin all stay at chart defaults) plus
# the extra spot toleration AKS needs. `kubectl kustomize aks` shows what the Helm install produces
# without running Helm; install.sh is the real install path for this chapter.
- op: add
  path: /spec/daemonsets/tolerations/-
  value:
    key: kubernetes.azure.com/scalesetpriority
    operator: Equal
    value: spot
    effect: NoSchedule
