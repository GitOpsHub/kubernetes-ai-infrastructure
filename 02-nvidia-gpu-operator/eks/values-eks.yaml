# nvidia/gpu-operator Helm values for EKS AL2023 accelerated (NVIDIA) AMI GPU nodes.
#
# The EKS-optimized AL2023 NVIDIA AMI (used by 01-gpu-nodes-and-scheduling/eks node groups) ships the
# NVIDIA driver, CUDA user-mode libs and nvidia-container-toolkit preinstalled via `nodeadm`. Disable
# the Operator's driver and toolkit so it doesn't try to reinstall them; let it manage the device
# plugin, DCGM, GFD, MIG manager instead so the same Operator install works across all three clouds.
#
# If you previously ran 01-gpu-nodes-and-scheduling/eks/install-device-plugin.sh (the standalone
# nvdp chart) on this cluster, remove it first — running two device plugins double-allocates GPUs:
#   helm -n nvidia-device-plugin uninstall nvdp

driver:
  enabled: false
toolkit:
  enabled: false
devicePlugin:
  enabled: true

cdi:
  enabled: true
  default: true

nfd:
  enabled: true

daemonsets:
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  # EKS managed node groups don't auto-taint spot nodes; this is the taint our eksctl nodegroup sets.

dcgmExporter:
  enabled: true
gfd:
  enabled: true
migManager:
  enabled: true
nodeStatusExporter:
  enabled: true
