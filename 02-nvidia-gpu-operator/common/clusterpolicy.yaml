# Cluster-scoped CR that the gpu-operator Helm chart's own values normally render and create for you
# (templates/clusterpolicy.yaml) — see install.sh in each cloud folder, which is the primary install
# path used in the lab. This copy exists so `kubectl kustomize` can render/diff, offline, exactly what
# each cloud's values-*.yaml produces (see gke/eks/aks clusterpolicy-patch.yaml), without touching a
# cluster or running Helm. Schema and defaults verified against the nvidia/gpu-operator chart
# ${GPU_OPERATOR_VERSION} (v26.7.0) CRD and `helm template --show-only templates/clusterpolicy.yaml`.
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: cluster-policy
spec:
  hostPaths:
    rootFS: /
    driverInstallDir: /run/nvidia/driver
  operator:
    runtimeClass: nvidia
  daemonsets:
    priorityClassName: system-node-critical
    updateStrategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: "1"
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  psa:
    enabled: false
  # CDI (Container Device Interface) is the supported device-injection mode on current driver/toolkit
  # versions; legacy nvidia-container-runtime mode is deprecated upstream.
  cdi:
    enabled: true
    default: true
  mig:
    strategy: single
  validator:
    repository: nvcr.io/nvidia
    image: gpu-operator
    version: "v26.7.0"
  # --- Driver: on by default (bare-metal / self-managed nodes). Each cloud overlay flips this off
  # where the node image already ships a vendor driver (GKE COS, EKS AL2023 accelerated AMI). ---
  driver:
    enabled: true
    repository: nvcr.io/nvidia
    image: driver
    version: "595.91.07"
    usePrecompiled: false
    rdma:
      enabled: false
  toolkit:
    enabled: true
    repository: nvcr.io/nvidia/k8s
    image: container-toolkit
    version: "v1.20.0"
  devicePlugin:
    enabled: true
    repository: nvcr.io/nvidia
    image: k8s-device-plugin
    version: "v0.20.0"        # matches DEVICE_PLUGIN_VERSION in versions.env
  # DCGM hostengine daemon: off by default upstream (dcgmExporter runs its own embedded hostengine).
  # Turn on only if something else on the node (e.g. a separate monitoring stack) needs the DCGM socket.
  dcgm:
    enabled: false
  dcgmExporter:
    enabled: true
    repository: nvcr.io/nvidia/k8s
    image: dcgm-exporter
    version: "4.6.0-4.8.3-distroless"   # DCGM 4.6.0 + dcgm-exporter 4.8.3, matches DCGM_EXPORTER_CHART_VERSION
  gfd:
    enabled: true
    repository: nvcr.io/nvidia
    image: gpu-feature-discovery
    version: "v0.20.0"
  migManager:
    enabled: true
    repository: nvcr.io/nvidia/cloud-native
    image: k8s-mig-manager
    version: "v0.15.0"
  nodeStatusExporter:
    enabled: true
  # NFD is a separate chart dependency (nfd.enabled: true at the Helm values root, not a ClusterPolicy
  # spec field) — labels nodes with feature.node.kubernetes.io/pci-10de.present etc. so GFD/toolkit
  # selectors work. See values-*.yaml `nfd.enabled`.
